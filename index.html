<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RBooks Capture</title>
<meta name="theme-color" content="#0E0E0F">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0E0E0F;--surf:#17171A;--surf2:#1F1F23;--line:#2A2A2F;--fg:#EDE9E1;--muted:#A8A193;--gold:#F8B925;--gold-soft:rgba(248,185,37,.12);--red:#F0766A;--red-soft:rgba(240,118,106,.12);--green:#5FC98B;--green-soft:rgba(95,201,139,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Manrope,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,14,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header img{width:30px;height:30px}
header .t{font:700 17px Sora,sans-serif;letter-spacing:.02em}
header .t span{color:var(--gold)}
.pill{margin-left:auto;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ia{color:var(--green);border-color:rgba(95,201,139,.4)}
.pill.demo{color:var(--gold);border-color:rgba(248,185,37,.4)}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font:700 24px/1.2 Sora,sans-serif;margin:6px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.cam{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;aspect-ratio:1/1;max-height:340px;border-radius:24px;border:2px dashed rgba(248,185,37,.45);background:radial-gradient(circle at 50% 40%,rgba(248,185,37,.10),transparent 60%),var(--surf);color:var(--fg);font:700 19px Sora,sans-serif;cursor:pointer}
.cam svg{width:64px;height:64px;color:var(--gold)}
.cam small{font:500 13px Manrope;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--fg);font:600 15px Manrope;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0E0E0F}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;font-size:13.5px;flex:0 0 auto}
.btn:disabled{opacity:.45}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.item img{width:64px;height:84px;object-fit:cover;border-radius:10px;background:var(--surf2)}
.item .n{font:600 15.5px Sora,sans-serif}
.item .m{color:var(--muted);font-size:13px}
.item .tot{font:700 17px Sora,sans-serif;color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:600 11.5px Manrope;padding:3px 8px;border-radius:999px;background:var(--surf2);color:var(--muted)}
.tag.warn{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.g{background:var(--gold-soft);color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi small{display:block;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:700 20px Sora,sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(14,14,15,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--muted);font:600 11.5px Manrope;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font:700 10px Manrope;border-radius:999px;padding:1px 5px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet img.big{width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:var(--surf);margin-bottom:12px}
label{display:block;font:600 12.5px Manrope;color:var(--muted);margin:10px 0 4px}
input{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--fg);font:500 16px Manrope}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;display:none}
.toast.on{display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<header><img src="/logo.png" alt=""><div class="t">RBooks <span>Capture</span></div><div class="pill" id="mode">…</div></header>
<main id="view"></main>
<nav id="nav">
  <button data-v="capturer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Capturer</button>
  <button data-v="verifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>À vérifier<span class="badge" id="bv" hidden></span></button>
  <button data-v="approuvees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Approuvées</button>
  <button data-v="exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Exporter</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="files" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="rbooks-capture-v1", CODEKEY="rbooks-capture-code";
var CFG={mode:"demo",code:false,rbooks:"demo"}, CATS=[], view="capturer", n=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("Mémoire du téléphone pleine : exportez et videz la liste.")}}
var items=load();
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var cents=function(x){return Math.round((Number(x)||0)*100)};
var money=function(x){return (Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}

/* ---- règles de vérification (reprises du pipeline Python) ---- */
function categorie(r){
  var txt=((r.fournisseur||"")+" "+(r.articles||[]).join(" ")).toLowerCase(), best=null, bn=0;
  CATS.forEach(function(c){var k=0;(c.motifs||[]).forEach(function(m){try{if(new RegExp(m,"i").test(txt))k++}catch(e){}});if(k>bn){bn=k;best=c}});
  return best||{code:"5900",nom:"Autres dépenses",cti_rti:1};
}
function verifier(r){
  var a=[], sub=cents(r.sous_total), tps=cents(r.tps), tvq=cents(r.tvq), pb=cents(r.pourboire), tot=cents(r.total);
  if(Math.abs(sub+tps+tvq+pb-tot)>3) a.push("Le total ne balance pas ("+money((sub+tps+tvq+pb)/100)+" calculé)");
  if(sub>0 && tps>0 && Math.abs(tps-Math.round(sub*0.05))>2) a.push("TPS différente de 5 %");
  if(sub>0 && tvq>0 && Math.abs(tvq-Math.round(sub*0.09975))>2) a.push("TVQ différente de 9,975 %");
  if((tps>0||tvq>0) && (!r.no_tps||!r.no_tvq)) a.push("Pas de nos de taxe : CTI/RTI non réclamables");
  if(sub>0 && pb>sub*0.25) a.push("Pourboire de plus de 25 %");
  if(!r.date) a.push("Date illisible");
  if((Number(r.confiance)||1)<0.8) a.push("Lecture incertaine");
  return a;
}
function enrichir(it){
  var c=categorie(it.r); it.cat=c.code+" "+c.nom; it.cti=c.cti_rti;
  it.alertes=verifier(it.r);
  if(c.cti_rti<1) it.alertes.push("Repas : 50 % des CTI/RTI");
  return it;
}

/* ---- image : réduite sur le téléphone avant l'envoi ---- */
function reduire(file,max,q){return new Promise(function(ok,ko){
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",q))};
  img.onerror=ko; img.src=u;
})}

function lire(file,idx){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var it={id:id,etat:"lecture",ajout:new Date().toISOString(),thumb:"",r:{},alertes:[]};
  items.unshift(it); n++; render();
  return Promise.all([reduire(file,1600,.82),reduire(file,360,.7)]).then(function(v){
    it.thumb=v[1]; render();
    var h={"Content-Type":"application/json"}, code=localStorage.getItem(CODEKEY); if(code) h["x-capture-code"]=code;
    return fetch("/api/lire",{method:"POST",headers:h,body:JSON.stringify({image:v[0],index:idx==null?n:idx})});
  }).then(function(r){
    if(r.status===401){localStorage.removeItem(CODEKEY);throw new Error("code")}
    if(!r.ok) throw new Error("lecture");
    return r.json();
  }).then(function(j){
    it.r=j.resultat||{}; it.mode=j.mode; it.modele=j.modele; it.etat="verifier"; enrichir(it);
    save(); render(); toast(it.alertes.length?"Lue : "+it.alertes.length+" point(s) à vérifier":"Lue et vérifiée");
  }).catch(function(e){
    it.etat="erreur"; save(); render();
    toast(e.message==="code"?"Code d'accès requis":"Lecture impossible, réessayez");
    if(e.message==="code") demanderCode();
  });
}

/* ---- vues ---- */
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  var nv=items.filter(function(i){return i.etat==="verifier"}).length, bv=$("bv"); bv.hidden=!nv; bv.textContent=nv;
  var v=$("view");
  if(view==="capturer") v.innerHTML=vCapturer();
  if(view==="verifier") v.innerHTML=vListe("verifier","À vérifier","Touchez une facture pour corriger les montants, puis approuvez-la.");
  if(view==="approuvees") v.innerHTML=vListe("approuvee","Approuvées","Prêtes à envoyer dans RBooks.");
  if(view==="exporter") v.innerHTML=vExporter();
  bind();
}
function vCapturer(){
  var enCours=items.filter(function(i){return i.etat==="lecture"});
  return '<h1>Nouvelle facture</h1><p class="sub">Photographiez une facture ou un reçu : RBooks lit le fournisseur, les montants, la TPS et la TVQ, puis vérifie les calculs.</p>'+
  '<button class="cam" id="bCam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Prendre une photo<small>Caméra arrière · une facture par photo</small></button>'+
  '<div class="row"><button class="btn" id="bFiles">Choisir des photos</button><button class="btn ghost" id="bDemo">Factures d\'exemple</button></div>'+
  (enCours.length?'<div class="card" style="margin-top:14px">'+enCours.map(function(i){return '<div class="busy"><div class="spin"></div>Lecture en cours…</div>'}).join("")+'</div>':"")+
  '<p class="note">'+(CFG.mode==="ia"?"Lecture par l'IA (Claude). Les calculs sont refaits par le code, jamais par l'IA.":"Mode démo : les lectures sont des exemples. Aucune photo n'est envoyée à une IA.")+'</p>';
}
function carte(i){
  var r=i.r||{}, tags=(i.alertes||[]).map(function(a){return '<span class="tag warn">'+esc(a)+'</span>'}).join("");
  if(i.etat==="verifier"&&!(i.alertes||[]).length) tags='<span class="tag ok">Montants vérifiés</span>';
  if(i.envoye) tags+='<span class="tag g">'+esc(i.envoye)+'</span>';
  if(i.cat) tags+='<span class="tag">'+esc(i.cat)+'</span>';
  return '<div class="card item" data-id="'+i.id+'">'+(i.thumb?'<img src="'+i.thumb+'" alt="">':'<img alt="">')+
  '<div><div class="n">'+esc(r.fournisseur||(i.etat==="erreur"?"Lecture impossible":"Lecture…"))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.numero?" · no "+esc(r.numero):"")+'</div>'+
  '<div class="tot">'+(r.total!=null?money(r.total):"")+'</div>'+
  (r.total!=null?'<div class="m">TPS '+money(r.tps)+' · TVQ '+money(r.tvq)+'</div>':"")+'<div class="tags">'+tags+'</div></div></div>';
}
function vListe(etat,titre,sous){
  var l=items.filter(function(i){return i.etat===etat||(etat==="verifier"&&i.etat==="erreur")});
  var head='<h1>'+titre+'</h1><p class="sub">'+sous+'</p>';
  if(etat==="approuvee"&&l.length){var ne=l.filter(function(i){return !i.envoye}).length;head+=ne?'<button class="btn gold" id="bSendAll" style="width:100%;margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à RBooks</button>':'<div class="tag ok" style="display:block;text-align:center;padding:10px;margin-bottom:14px">Tout est envoyé à RBooks</div>';}
  return head+(l.length?l.map(carte).join(""):'<div class="empty">Rien ici pour l\'instant.</div>');
}
function totaux(l){var t={n:l.length,sub:0,tps:0,tvq:0,pb:0,tot:0};l.forEach(function(i){var r=i.r;t.sub+=cents(r.sous_total);t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.pb+=cents(r.pourboire);t.tot+=cents(r.total)});return t}
function vExporter(){
  var l=items.filter(function(i){return i.etat==="approuvee"}), t=totaux(l);
  return '<h1>Exporter</h1><p class="sub">Les factures approuvées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>Total</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><button class="btn gold" id="bXlsx"'+(t.n?"":" disabled")+'>Excel (.xlsx)</button><button class="btn" id="bCsv"'+(t.n?"":" disabled")+'>CSV</button></div>'+
  '<div class="row"><button class="btn ghost" id="bVider">Vider la liste</button></div>'+
  '<p class="note">L\'Excel contient une feuille par mois et une feuille TPS/TVQ (CTI et RTI réclamables).</p>';
}

function ouvrir(id){
  var i=items.find(function(x){return x.id===id}); if(!i||i.etat==="lecture") return;
  var r=i.r||{}, f=function(k,l,t){return '<div><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" inputmode="'+(t||"decimal")+'" value="'+esc(r[k]==null?"":r[k])+'"></div>'};
  $("sheetIn").innerHTML=(i.thumb?'<img class="big" src="'+i.thumb+'" alt="">':"")+
  '<div class="tags" style="margin:0 0 6px">'+(i.alertes||[]).map(function(a){return '<span class="tag warn">'+esc(a)+'</span>'}).join("")+(i.modele?'<span class="tag">Lu par : '+esc(i.modele)+'</span>':"")+'</div>'+
  f("fournisseur","Fournisseur","text")+'<div class="g2">'+f("date","Date (AAAA-MM-JJ)","text")+f("numero","No de facture","text")+f("no_tps","No TPS","text")+f("no_tvq","No TVQ","text")+
  f("sous_total","Sous-total")+f("tps","TPS")+f("tvq","TVQ")+f("pourboire","Pourboire")+'</div>'+f("total","Total")+
  '<div class="row"><button class="btn ghost" id="bRej">Rejeter</button><button class="btn" id="bSave">Enregistrer</button>'+(i.etat!=="approuvee"?'<button class="btn gold" id="bOk">Approuver</button>':"")+'</div>';
  $("sheet").classList.add("on");
  var lireForm=function(){["fournisseur","date","numero","no_tps","no_tvq"].forEach(function(k){r[k]=$("f_"+k).value.trim()});["sous_total","tps","tvq","pourboire","total"].forEach(function(k){r[k]=Number(String($("f_"+k).value).replace(",","."))||0});i.r=r;enrichir(i)};
  $("bSave").onclick=function(){lireForm();save();fermer();render();toast(i.alertes.length?i.alertes.length+" point(s) restant(s)":"Montants vérifiés")};
  if($("bOk")) $("bOk").onclick=function(){lireForm();i.etat="approuvee";save();fermer();render();toast("Approuvée")};
  $("bRej").onclick=function(){items=items.filter(function(x){return x.id!==id});save();fermer();render();toast("Facture retirée")};
}
function fermer(){$("sheet").classList.remove("on")}
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")fermer()});

function envoyer(){
  var l=items.filter(function(i){return i.etat==="approuvee"&&!i.envoye});
  if(!l.length) return toast("Tout est déjà envoyé");
  l.forEach(function(i,k){setTimeout(function(){i.envoye=CFG.rbooks==="connecte"?"Envoyée à RBooks":"Envoyée à RBooks (démo)";i.envoiNo="FF-"+String(1000+k+Math.floor(Math.random()*900));save();render()},400*(k+1))});
  toast(CFG.rbooks==="connecte"?"Envoi à RBooks…":"Démo : envoi simulé, RBooks local non relié à cette page");
}

/* ---- exports ---- */
function lignes(){
  return items.filter(function(i){return i.etat==="approuvee"}).map(function(i){var r=i.r,cti=i.cti==null?1:i.cti,ok=r.no_tps&&r.no_tvq;
    return {"Date":r.date||"","Fournisseur":r.fournisseur||"","No facture":r.numero||"","Catégorie":i.cat||"","Sous-total":+(r.sous_total||0),"TPS":+(r.tps||0),"TVQ":+(r.tvq||0),"Pourboire":+(r.pourboire||0),"Total":+(r.total||0),
      "CTI réclamable":ok?Math.round((r.tps||0)*cti*100)/100:0,"RTI réclamable":ok?Math.round((r.tvq||0)*cti*100)/100:0,"No TPS":r.no_tps||"","No TVQ":r.no_tvq||"","Alertes":(i.alertes||[]).join(" | ")}});
}
function telecharger(nom,blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function csv(){var L=lignes();if(!L.length)return;var h=Object.keys(L[0]),q=function(v){v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var t=[h.join(";")].concat(L.map(function(o){return h.map(function(k){return q(typeof o[k]==="number"?String(o[k]).replace(".",","):o[k])}).join(";")})).join("\r\n");
  telecharger("rbooks-factures.csv",new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}))}
