.mod{font:500 13px Manrope;color:var(--muted);padding-left:10px;border-left:1px solid var(--border)}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 12px Manrope;line-height:1.2;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--raised);color:var(--fg2)}
.tag.rouge{color:var(--red);background:var(--red-bg);border-color:var(--red-b)}
.tag.orange{color:var(--ora);background:var(--ora-bg);border-color:var(--ora-b)}
.tag.vert{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-b)}
.tag.draft{color:var(--draft);background:var(--draft-bg);border-color:var(--draft-b)}
.top .tag{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:11px}
main{padding:18px 16px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.org{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font:600 14px Manrope;color:var(--fg);margin-bottom:18px}
.org span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{font:600 26px/1.15 Sora,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
h2{font:600 18px/1.25 Sora,sans-serif;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 0 12px}
.brief{background:var(--brief);border:1px solid var(--brief-b);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.brief h3{font:600 14px Sora,sans-serif;margin:0 0 8px;color:var(--gold-strong)}
.brief ol{margin:0;padding-left:20px;color:var(--fg2);font-size:14px}
.brief li{margin:3px 0}
.row{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg);font:600 14.5px Manrope;cursor:pointer;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,nav button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;cursor:pointer}
.item img{width:58px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--raised)}
.item .n{font:500 15.5px Sora,sans-serif;letter-spacing:-.01em}
.item .m{color:var(--muted);font:500 12px "JetBrains Mono",monospace;margin-top:2px}
.item .tx{color:var(--fg2);font-size:13px;margin-top:4px}
.item .tot{font:600 16px Sora,sans-serif;white-space:nowrap;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;grid-column:1/-1}
.empty{text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--border);border-radius:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.kpi small{display:block;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font:600 21px Sora,sans-serif;letter-spacing:-.01em;margin-top:2px}
.theme{width:36px;height:36px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg2);display:grid;place-items:center;cursor:pointer;flex:none}
.theme svg{width:18px;height:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;border-radius:10px;color:var(--muted);font:600 11.5px Manrope;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;position:relative}
nav button svg{width:20px;height:20px}
nav button.on{background:var(--nav);color:var(--nav-fg)}
nav .badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--red);color:#fff;font:700 10px Manrope;border-radius:6px;padding:0 5px;line-height:16px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(14,14,15,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--input);margin:0 auto 14px}
.sheet img.big{width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid var(--border);background:var(--card);margin-bottom:12px}
label{display:block;font:600 12.5px Manrope;color:var(--muted);margin:10px 0 4px}
input{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg);font:500 16px Manrope}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:20;background:var(--fg);color:var(--bg);border-radius:10px;padding:11px 14px;font:600 14px Manrope;display:none}
.toast.on{display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
</style>
<style>
select{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg);font:500 16px Manrope}
a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.item .m,.item .tx{overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--divider);font-size:14px}
.kv b{font:600 14px Sora,sans-serif}
.sec{font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.thumbrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.thumbrow img.big{flex:none;width:auto;max-width:100%;height:240px;margin:0}
@media (min-width:700px){main{max-width:640px}}
</style>
</head>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var ST={mode:"",rbooks_pret:false,rbooks_url:"",categories:[]}, DOCS=[], view="capturer", lecture=0, ouvertId=null;
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var vide=function(x){return x===""||x==null};
var money=function(x){return vide(x)?"—":(Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
var cents=function(x){return Math.round((Number(x)||0)*100)};
function toast(t,ms){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},ms||3000)}
function api(u,o){return fetch(u,o).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function post(u,b){return api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})}

function charger(){
  return Promise.all([api("/api/status"),api("/api/docs")]).then(function(v){
    ST=v[0];DOCS=v[1];
    var p=$("mode");p.textContent=ST.mode==="reel"?"Lecture IA":"Démo";p.className="tag "+(ST.mode==="reel"?"vert":"draft");
    if(!$("sheet").classList.contains("on"))render();
  }).catch(function(){toast("Application locale injoignable")});
}
function grp(d){
  if(d.statut==="A_VERIFIER"||d.statut==="NON_LU")return "verifier";
  if(d.statut==="APPROUVE"||d.statut==="ENVOYE")return "approuvees";
  return "autres";
}
function numero(d){return d.bill_id?"CAP-"+d.id+((d.r&&d.r.no_facture)?"-"+d.r.no_facture:""):""}
function ton(a){return /incohérent|illisible|non réclamables|total|balance|impossible/i.test(a)?"rouge":"orange"}
function tagsAlertes(d){
  var r=d.r;if(!r)return "";
  var t=r.equilibre?'<span class="tag vert">Total équilibré</span>':'<span class="tag rouge">Total qui ne balance pas</span>';
  return t+(r.alertes||[]).map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join("");
}

/* ---- vues ---- */
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  var nv=DOCS.filter(function(d){return grp(d)==="verifier"}).length, bv=$("bv");bv.hidden=!nv;bv.textContent=nv;
  var v=$("view");
  if(view==="capturer")v.innerHTML=vCapturer();
  if(view==="verifier")v.innerHTML=vVerifier();
  if(view==="approuvees")v.innerHTML=vApprouvees();
  if(view==="exporter")v.innerHTML=vExporter();
  bind();
}
function vCapturer(){
  var nv=DOCS.filter(function(d){return grp(d)==="verifier"}).length;
  var cam='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  return '<h1>Capture de factures</h1><p class="sub">Photographiez vos factures et vos reçus : RBooks les lit, vérifie la TPS et la TVQ, et les prépare pour la comptabilité.</p>'+
  '<div class="card"><h2>Nouvelle facture</h2><p class="sub" style="margin-bottom:14px">Une facture par photo, bien à plat et lisible.</p>'+
  '<button class="btn gold full" id="bCam">'+cam+'Prendre une photo</button>'+
  '<div class="row"><button class="btn" id="bFiles">Galerie photo</button><button class="btn" id="bDemo">Exemples</button></div>'+
  (lecture?'<div class="busy" style="margin-top:14px"><div class="spin"></div>'+lecture+' lecture'+(lecture>1?'s':'')+' en cours…</div>':"")+
  '<div class="tags" style="margin-top:14px">'+(ST.rbooks_pret?'<span class="tag vert">RBooks : serveur prêt</span>':'<span class="tag orange">RBooks : serveur pas prêt, envoi en attente</span>')+'</div></div>'+
  (nv?'<div class="card item" id="goV" style="grid-template-columns:1fr auto;align-items:center"><div><div class="n">'+nv+' facture'+(nv>1?'s':'')+' à vérifier</div><div class="tx">Corrigez si besoin, puis approuvez.</div></div><span class="tag orange">Orange</span></div>':"")+
  '<div class="brief"><h3>Comment ça marche</h3><ol><li>Vous prenez la photo.</li><li>'+(ST.mode==="reel"?"L'IA lit le fournisseur et les montants ; le code refait les calculs.":"Démo : seules les photos déjà lues sont reconnues, les autres sont à saisir à la main ; le code refait les calculs.")+'</li><li>Vous approuvez, puis RBooks crée la facture fournisseur.</li></ol></div>';
}
function carte(d){
  var r=d.r||{}, g=grp(d), tags="";
  if(g==="verifier")tags+=(d.r?tagsAlertes(d):'<span class="tag orange">À saisir</span>')+(d.message?'<span class="tag rouge">'+esc(d.message)+'</span>':"");
  if(g==="approuvees"){
    tags+=d.statut==="ENVOYE"?'<span class="tag vert">Envoyée à RBooks</span><span class="tag draft">Facture '+esc(numero(d))+'</span>':'<span class="tag vert">Approuvée</span>';
    if(d.erreur_envoi)tags+='<span class="tag orange">'+esc(d.erreur_envoi)+'</span>';
  }
  if(g==="autres")tags+='<span class="tag rouge">'+esc(d.message||d.statut)+(d.doublon_de?" ("+esc(d.doublon_de)+")":"")+'</span>';
  if(r.categorie_code)tags+='<span class="tag">'+esc(r.categorie_code+" "+r.categorie)+'</span>';
  return '<div class="card item" data-id="'+esc(d.id)+'"><img src="'+esc(d.photos[0]||"")+'" alt="" loading="lazy">'+
  '<div><div class="n">'+esc(r.marchand||(d.fichiers[0]||"Facture"))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.no_facture?" · "+esc(r.no_facture):"")+'</div>'+
  (d.r?'<div class="tx">TPS '+money(r.tps)+' · TVQ '+money(r.tvq)+'</div>':"")+'</div>'+
  '<div class="tot">'+(d.r?money(r.total):"")+'</div><div class="tags">'+tags+'</div></div>';
}
function liste(g){return DOCS.filter(function(d){return grp(d)===g})}
function vVerifier(){
  var l=liste("verifier"), a=liste("autres");
  return '<h1>À vérifier</h1><p class="sub">Touchez une facture pour corriger les montants, puis approuvez-la.</p>'+
   (l.length?l.map(carte).join(""):'<div class="empty">Rien ici pour l\'instant.</div>')+
   (a.length?'<div class="sec">Doublons et non lus</div>'+a.map(carte).join(""):"");
}
function vApprouvees(){
  var l=liste("approuvees"), ne=l.filter(function(d){return d.statut==="APPROUVE"}).length;
  var head='<h1>Approuvées</h1><p class="sub">Les factures approuvées sont créées comme factures fournisseurs dans RBooks.</p>';
  if(l.length)head+=ne?'<button class="btn gold full" id="bSendAll" style="margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à RBooks</button>':'<div class="brief" style="text-align:center;font-weight:600">Tout est envoyé à RBooks.</div>';
  return head+(l.length?l.map(carte).join(""):'<div class="empty">Rien ici pour l\'instant.</div>');
}
function vExporter(){
  var l=liste("approuvees"), t={n:l.length,tps:0,tvq:0,tot:0};
  l.forEach(function(d){var r=d.r||{};t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.tot+=cents(r.total)});
  var off=t.n?"":' aria-disabled="true"';
  return '<h1>Exporter</h1><p class="sub">Les factures approuvées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>Total</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><a class="btn gold" id="bXlsx" href="/export/transactions.xlsx" download'+off+'>Excel (.xlsx)</a><a class="btn" id="bCsv" href="/export/transactions.csv" download'+off+'>CSV</a></div>'+
  '<div class="row"><button class="btn" id="bVider">Remettre la démo à zéro</button></div>'+
  '<p class="note">L\'export contient les factures à vérifier, approuvées et envoyées, avec la TPS, la TVQ et les CTI/RTI réclamables.</p>';
}
/* ---- fiche d'une facture ---- */
function ouvrir(id){
  var d=DOCS.find(function(x){return x.id===id});if(!d)return;
  ouvertId=id;
  var r=d.r||{}, c=d.corrections||{}, envoye=d.statut==="ENVOYE";
  var val=function(k){var x=c[k]!=null?c[k]:r[k];return esc(x==null?"":x)};
  var f=function(k,l,t){return '<div><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" data-k="'+k+'" inputmode="'+(t||"decimal")+'" value="'+val(k)+'"'+(envoye?" disabled":"")+'></div>'};
  var cur=c.categorie||r.categorie_code;
  var opts=(ST.categories||[]).map(function(x){return '<option value="'+esc(x.code)+'"'+(x.code===cur?" selected":"")+'>'+esc(x.code+" "+x.nom)+'</option>'}).join("");
  var h='<div class="grab"></div><div class="thumbrow">'+d.photos.map(function(p){return '<img class="big" src="'+esc(p)+'" alt="Photo de la facture">'}).join("")+'</div>'+
   '<div class="tags" style="margin:0 0 6px">'+tagsAlertes(d)+(d.moteur?'<span class="tag">Lu par : '+esc(d.moteur)+'</span>':"")+'</div>';
  if(d.message)h+='<div class="tags" style="margin:0 0 6px"><span class="tag rouge">'+esc(d.message)+'</span></div>';
  if(d.erreur_envoi)h+='<div class="tags" style="margin:0 0 6px"><span class="tag orange">'+esc(d.erreur_envoi)+'</span></div>';
  if(envoye)h+='<div class="brief" style="margin-top:10px"><h3>Envoyée à RBooks</h3><div class="kv"><span>Facture fournisseur</span><b>'+esc(numero(d))+'</b></div><div class="kv"><span>Identifiant RBooks</span><b>#'+esc(d.bill_id)+'</b></div></div>';
  h+=f("marchand","Fournisseur","text")+'<div class="g2">'+f("date","Date (AAAA-MM-JJ)","text")+f("no_facture","No de facture","text")+f("no_tps","No TPS","text")+f("no_tvq","No TVQ","text")+
   f("sous_total","Sous-total")+f("tps","TPS")+f("tvq","TVQ")+f("pourboire","Pourboire")+'</div>'+f("total","Total")+
   '<label for="f_categorie">Catégorie</label><select id="f_categorie" data-k="categorie"'+(envoye?" disabled":"")+'>'+opts+'</select>';
  var b='';
  if(d.statut==="A_VERIFIER")b+='<button class="btn" id="bRej">Rejeter</button>';
  if(!envoye)b+='<button class="btn" id="bSave">Enregistrer</button>';
  if(d.statut==="A_VERIFIER")b+='<button class="btn gold" id="bOk">Approuver</button>';
  if(d.statut==="APPROUVE")b+='<button class="btn gold" id="bSend">Envoyer à RBooks</button>';
  if(envoye)b+='<button class="btn" id="bClose">Fermer</button>';
  h+='<div class="row">'+b+'</div>';
  $("sheetIn").innerHTML=h;$("sheet").classList.add("on");
  var g=function(i,fn){var e=$(i);if(e)e.onclick=fn};
  var champs=function(){var o={},ch=false;document.querySelectorAll("#sheetIn [data-k]").forEach(function(e){o[e.dataset.k]=e.value.trim()});
    Object.keys(o).forEach(function(k){var ini=c[k]!=null?c[k]:(k==="categorie"?r.categorie_code:r[k]);if(String(o[k])!==String(ini==null?"":ini))ch=true});return ch?o:null};
  var occupe=function(on){document.querySelectorAll("#sheetIn .btn").forEach(function(e){e.disabled=on})};
  var enregistrer=function(){var o=champs();return o?post("/api/docs/"+d.id+"/correct",o):Promise.resolve()};
  var fin=function(msg,ms){fermer();return charger().then(function(){toast(msg(DOCS.find(function(y){return y.id===d.id})),ms||3000)})};
  var err=function(e){occupe(false);toast("Erreur : "+e.message)};
  g("bSave",function(){occupe(true);enregistrer().then(function(){return fin(function(){return "Correction enregistrée"})}).catch(err)});
  g("bOk",function(){occupe(true);toast("Envoi à RBooks…",60000);
    enregistrer().then(function(){return post("/api/docs/"+d.id+"/approve")}).then(function(x){
      if(!x.envoi)view="approuvees";
      return fin(function(n){return x.envoi?"Approuvée. "+x.envoi:"Envoyée à RBooks : facture "+(n?numero(n):"")},6000)}).catch(err)});
  g("bSend",function(){occupe(true);toast("Envoi à RBooks…",60000);
    enregistrer().then(function(){return post("/api/docs/"+d.id+"/send")}).then(function(x){
      return fin(function(n){return x.ok?"Envoyée à RBooks : facture "+(n?numero(n):""):x.erreur},6000)}).catch(err)});
  g("bRej",function(){post("/api/docs/"+d.id+"/reject").then(function(){return fin(function(){return "Facture rejetée"})}).catch(err)});
  g("bClose",fermer);
}
function fermer(){$("sheet").classList.remove("on");ouvertId=null;render()}
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")fermer()});

/* ---- actions ---- */
function televerser(files){
  files=[].slice.call(files);if(!files.length)return;
  var fd=new FormData();files.forEach(function(f){fd.append("files",f)});
  lecture+=files.length;view="verifier";render();toast("Lecture en cours…",60000);
  api("/api/upload",{method:"POST",body:fd}).then(function(r){
    var n=r.filter(function(x){return x.action==="a_verifier"||x.action==="fusionne"}).length;
    toast(r.length+" photo(s) reçue(s) : "+n+" à vérifier",5000);
  }).catch(function(e){toast("Lecture impossible : "+e.message,5000)}).then(function(){lecture-=files.length;return charger()});
}
function demo(){toast("Chargement des exemples…",30000);view="verifier";post("/api/demo-load").then(function(){toast("Exemples chargés");return charger()}).catch(function(e){toast("Erreur : "+e.message)})}
function envoyerTout(){toast("Envoi à RBooks…",60000);post("/api/send-approved").then(function(r){toast(r.envoyes+" / "+r.total+" facture(s) envoyée(s) à RBooks",5000);return charger()}).catch(function(e){toast("Erreur : "+e.message)})}
function bind(){
  var g=function(id,f){var e=$(id);if(e)e.onclick=f};
  g("bCam",function(){$("cam").click()});g("bFiles",function(){$("files").click()});g("bDemo",demo);g("goV",function(){view="verifier";render()});g("bSendAll",envoyerTout);
  g("bVider",function(){var b=$("bVider");if(!b.dataset.c){b.dataset.c=1;b.textContent="Toucher encore pour tout effacer";return}post("/api/reset").then(function(){return charger()}).then(function(){toast("Démo remise à zéro")})});
  document.querySelectorAll(".item[data-id]").forEach(function(e){e.onclick=function(){ouvrir(e.dataset.id)}});
}
$("cam").onchange=function(){televerser(this.files);this.value=""};
$("files").onchange=$("cam").onchange;
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();window.scrollTo(0,0)});

/* ---- thème clair / sombre ---- */
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function sombre(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
function majTheme(){var d=sombre();$("bTheme").innerHTML=d?SUN:MOON;$("bTheme").setAttribute("aria-label",d?"Passer au thème clair":"Passer au thème sombre");
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",d?"#0E0E0F":"#F6F4EF")})}
$("bTheme").onclick=function(){var t=sombre()?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("rbooks-theme",t)}catch(e){};majTheme()};
majTheme();
render();charger();
setInterval(function(){if(!ouvertId&&!lecture)charger()},8000);
})();
</script>
</body>
</html>
