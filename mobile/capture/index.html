<script>/* Thème avant le premier rendu (aucun flash). Même logique que l'app NEKHEVI. */(function(){var d=document.documentElement,T=["editorial","instrument","verre","bento"];try{var q=new URLSearchParams(location.search),s=localStorage;if(q.get("theme"))s.setItem("nk-theme",q.get("theme"));if(q.get("mode"))s.setItem("nk-mode",q.get("mode"));var t=s.getItem("nk-theme"),m=s.getItem("nk-mode")||s.getItem("rbooks-theme");d.setAttribute("data-nk-theme",T.indexOf(t)>-1?t:"instrument");if(m==="light"||m==="dark")d.setAttribute("data-theme",m);if(s.getItem("nk-motion")==="reduce")d.setAttribute("data-motion","reduce")}catch(e){d.setAttribute("data-nk-theme","instrument")}})();</script>

/* Entreprise active (multi-clients) */
.orgchip{display:inline-flex;align-items:center;gap:8px;max-width:46vw;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--org,var(--nk-accent));background:color-mix(in oklab,var(--org,var(--nk-accent)) 12%,transparent);color:var(--nk-fg);font:600 13px/1 var(--nk-font-sans,system-ui);cursor:default;white-space:nowrap}
.orgchip[data-sel="1"]{cursor:pointer}
.orgchip i{width:10px;height:10px;border-radius:50%;background:var(--org,var(--nk-accent));flex:none}
.orgchip span{overflow:hidden;text-overflow:ellipsis}
.orgchip svg{width:14px;height:14px;flex:none;opacity:.7}
.orglist{display:grid;gap:10px;margin:14px 0 4px}
.orglist button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-radius:14px;border:1px solid var(--nk-border);background:var(--nk-surface,transparent);color:var(--nk-fg);font:600 15px/1.2 var(--nk-font-sans,system-ui);text-align:left;cursor:pointer}
.orglist button[aria-current="true"]{border-color:var(--org);box-shadow:0 0 0 2px color-mix(in oklab,var(--org) 35%,transparent)}
.orglist button i{width:14px;height:14px;border-radius:50%;background:var(--org);flex:none}
.orglist button small{display:block;font-weight:400;color:var(--nk-fg-muted);margin-top:3px}
.porte{max-width:460px;margin:8vh auto 0;text-align:center}
.porte img{width:72px;height:72px}
.porte .btn{margin-top:18px}
.porte .code6{font:500 28px/1 var(--nk-font-mono,monospace);letter-spacing:.3em;text-align:center}
body.sans-nav nav#nav{display:none}
@media (max-width:520px){.top .mod{display:none}.orgchip{max-width:52vw}}
</style>

<body>
<div class="splash" id="splash" aria-hidden="true"><div class="b"><img src="/brand/ncapture-marque-fond-sombre.svg" alt=""><b><i>N</i>Capture</b><div class="bar"></div></div></div>
<header class="top">
  <a class="logo" href="/capture" aria-label="NCapture, accueil"><img class="lg-d" src="/brand/ncapture-marque-fond-sombre.svg" alt=""><img class="lg-l" src="/brand/ncapture-marque-fond-clair.svg" alt=""><b><i>N</i>Capture</b></a>
  <span class="sep"></span><span class="mod">NEKHEVI</span><span class="sp"></span>
  <button type="button" class="orgchip" id="org" hidden aria-label="Entreprise active"></button>

  <a class="lnk" href="/nbooks" target="nbooks" aria-label="Ouvrir NBooks">NBooks<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg></a>
</header>
<main id="view"></main>
<nav id="nav" aria-label="Sections">
  <button data-v="capturer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>Capturer</button>
  <button data-v="verifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l9 15.5H3z"/><path d="M12 10v4M12 16.8v.4"/></svg>À vérifier<span class="badge" id="bv" hidden></span></button>
  <button data-v="approuvees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Approuvées</button>
  <button data-v="exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Exporter</button>
  <button data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>

<input type="file" id="files" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/ncapture-ui.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="ncapture-v1", CODEKEY="ncapture-code";
var CFG={mode:"demo",code:false}, CATS=[], view="capturer", n=0, ouvertId=null;
/* Multi-clients : SRV = données dans l'espace NEKHEVI de l'entreprise (serveur) ; sinon repli local (ancien code). */
var SRV=false, ORG=null, ORGS=[], MOI=null, SEL=false, ORGKEY="ncapture-org", synchro={}, porteOuverte=false;
function H(){var h={"Content-Type":"application/json","x-ncapture":"1"};if(SRV&&ORG)h["x-ncapture-org"]=ORG.id;var c=code();if(!SRV&&c)h["x-capture-code"]=c;return h}
function snap(i){return JSON.stringify({r:i.r,cat:i.cat,cti:i.cti,alertes:i.alertes,etat:i.etat})}
function load(){if(SRV)return[];try{return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("rbooks-capture-v1"))||[]}catch(e){return[]}}
function save(){
  if(!SRV){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("Mémoire du téléphone pleine : exportez et videz la liste.")}return}
  items.forEach(function(i){ if(!i.srv||i.etat==="lecture") return; var s=snap(i); if(synchro[i.id]===s) return; synchro[i.id]=s;
    fetch("/api/documents?id="+encodeURIComponent(i.id),{method:"PATCH",headers:H(),body:JSON.stringify({r:i.r,categorie:i.cat||"",cti_rti:i.cti==null?1:i.cti,alertes:i.alertes||[],etat:i.etat==="erreur"?"verifier":i.etat,mode:i.mode||"",modele:i.modele||""})})
      .then(function(x){if(x.status===401)return sessionPerdue();if(!x.ok){delete synchro[i.id];toast("Enregistrement non fait, réessayez")}})
      .catch(function(){delete synchro[i.id];toast("Hors ligne : modification non enregistrée")});
  });
}
var items=[];
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var cents=function(x){return Math.round((Number(x)||0)*100)};
var money=function(x){return (Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}
function code(){try{return localStorage.getItem(CODEKEY)||localStorage.getItem("rbooks-capture-code")}catch(e){return null}}

/* ---- règles de vérification (reprises du pipeline Python, inchangées) ---- */
function categorie(r){
  // Le nom du fournisseur décide d'abord ; les articles servent seulement d'indice (signalé à l'usager).
  var four=(r.fournisseur||"").toLowerCase(), art=(r.articles||[]).join(" ").toLowerCase(), best=null, bn=0, parArt=false;
  CATS.forEach(function(c){var kf=0,ka=0;(c.motifs||[]).forEach(function(m){try{var re=new RegExp(m,"i");if(re.test(four))kf++;else if(re.test(art))ka++}catch(e){}});var k=kf*10+ka;if(k>bn){bn=k;best=c;parArt=kf===0}});
  if(!best||!four.trim()) return {code:"5900",nom:"À classer",cti_rti:1,doute:true};
  return {code:best.code,nom:best.nom,cti_rti:best.cti_rti,doute:parArt||/^À classer/.test(best.nom)};
}
function verifier(r){
  var a=[], sub=cents(r.sous_total), tps=cents(r.tps), tvq=cents(r.tvq), pb=cents(r.pourboire), tot=cents(r.total);
  if(Math.abs(sub+tps+tvq+pb-tot)>3) a.push("Le total ne balance pas ("+money((sub+tps+tvq+pb)/100)+" calculé)");
  if(sub>0 && tps>0 && Math.abs(tps-Math.round(sub*0.05))>2) a.push("TPS différente de 5 %");
  if(sub>0 && tvq>0 && Math.abs(tvq-Math.round(sub*0.09975))>2) a.push("TVQ différente de 9,975 %");
  if((tps>0||tvq>0) && (!r.no_tps||!r.no_tvq)) a.push("Pas de nos de taxe : CTI/RTI non réclamables");
  if(sub>0 && pb>sub*0.25) a.push("Pourboire de plus de 25 %");
  if(!r.date) a.push("Date illisible");
  if((Number(r.confiance)||1)<0.8) a.push("Lecture incertaine");
  return a;
}
function enrichir(it){
  var c=categorie(it.r); it.cat=it.catManuelle||(c.code+" "+c.nom); it.cti=it.catManuelle?ctiDe(it.catManuelle):c.cti_rti;
  it.alertes=verifier(it.r);
  if(it.cti<1) it.alertes.push("Repas : 50 % des CTI/RTI");
  if(c.doute&&!it.catManuelle) it.alertes.push("Catégorie à confirmer");
  if(it.mode==="non-lu") it.alertes.unshift("Photo non lue (mode démo) : saisissez le fournisseur et les montants");
  else if((Number(it.r.confiance)||0)<0.8) it.alertes.push("Lecture incertaine : comparez avec la photo");
  return it;
}
function ctiDe(cat){var c=CATS.find(function(x){return (x.code+" "+x.nom)===cat});return c?c.cti_rti:1}

/* ---- image : réduite sur le téléphone avant l'envoi ---- */
function reduire(file,max,q){return new Promise(function(ok,ko){
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",q))};
  img.onerror=ko; img.src=u;
})}

function lire(file,idx){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var it={id:id,etat:"lecture",ajout:new Date().toISOString(),thumb:"",r:{},alertes:[]};
  items.unshift(it); n++; render();
  var grand="", orgLecture=ORG&&ORG.id;
  return Promise.all([reduire(file,1600,.82),reduire(file,360,.7)]).then(function(v){
    it.thumb=v[1]; grand=v[0]; render();
    return fetch("/api/lire",{method:"POST",headers:H(),body:JSON.stringify(idx==null?{image:v[0]}:{image:v[0],index:idx,demo:true})});
  }).then(function(r){
    if(r.status===401){if(SRV)throw new Error("session");try{localStorage.removeItem(CODEKEY)}catch(e){}throw new Error("code")}
    if(r.status===402) throw new Error("budget");
    if(!r.ok) throw new Error("lecture");
    return r.json();
  }).then(function(j){
    it.mode=j.mode; it.modele=j.modele; it.r=j.resultat||{}; it.etat="verifier"; it.neuf=true; enrichir(it);
    if(!SRV){save(); render(); if(ouvertId===it.id) ouvrir(it.id); return}
    if(!ORG||ORG.id!==orgLecture){items=items.filter(function(x){return x!==it});render();return}
    // Enregistrée dans l'espace de l'entreprise (table + photo privée), puis l'id du serveur remplace l'id local.
    var s0=snap(it);
    return fetch("/api/documents",{method:"POST",headers:H(),body:JSON.stringify({cle:it.id,r:it.r,mode:it.mode,modele:it.modele,categorie:it.cat,cti_rti:it.cti,alertes:it.alertes,image:grand,thumb:it.thumb})})
      .then(function(x){if(x.status===401)throw new Error("session");if(!x.ok)throw new Error("enregistrement");return x.json()})
      .then(function(d){var ancien=it.id;it.id=d.document.id;it.srv=true;it.ajout=d.document.ajout;synchro[it.id]=s0;if(ouvertId===ancien)ouvertId=it.id;save();render();if(ouvertId===it.id)ouvrir(it.id)});
  }).then(function(){
    if(it.etat==="verifier") toast(it.alertes.length?"Lue : "+it.alertes.length+" point(s) à vérifier":"Lue et vérifiée");
  }).catch(function(e){
    it.etat="erreur"; save(); render();
    toast(e.message==="code"?"Code d'accès requis":e.message==="session"?"Session expirée : reconnectez-vous":e.message==="budget"?"Budget IA du mois atteint pour cette entreprise":e.message==="enregistrement"?"Lue, mais pas enregistrée : réessayez":"Lecture impossible, réessayez");
    if(e.message==="code") demanderCode();
    if(e.message==="session") sessionPerdue();
  });
}

/* ---- vues ---- */
function render(){
  if(porteOuverte) return;
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view);if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  var nv=items.filter(function(i){return i.etat==="verifier"}).length, bv=$("bv"); bv.hidden=!nv; bv.textContent=nv;
  var v=$("view");
  if(view==="capturer") v.innerHTML=vCapturer();
  if(view==="verifier") v.innerHTML=vListe("verifier","À vérifier","Touchez une facture pour corriger les montants, puis approuvez-la.");
  if(view==="approuvees") v.innerHTML=vListe("approuvee","Approuvées","Prêtes pour NBooks. Elles apparaissent aussitôt sur la page NBooks de l’ordinateur.");
  if(view==="exporter") v.innerHTML=vExporter();
  if(view==="reglages") v.innerHTML=NC.vueReglages({extra:vReglagesApp(),version:"Version mobile.",licence:"/LICENSE.txt"});
  bind();
  items.forEach(function(i){i.neuf=false});
}
function vCapturer(){
  var enCours=items.filter(function(i){return i.etat==="lecture"}).length, nv=items.filter(function(i){return i.etat==="verifier"}).length, I=NC.icones;
  var pret=items.filter(function(i){return i.etat==="approuvee"&&!i.envoye}).length;
  return '<p class="eyebrow">'+esc(ORG?ORG.nom:"Entreprise Démo inc.")+'</p><h1>Capture de factures</h1><p class="sub">Photographiez vos factures et vos reçus : NCapture lit le fournisseur et les montants, vérifie la TPS et la TVQ, et prépare tout pour NBooks.</p>'+
  '<div class="home"><div>'+
  '<div class="shoot"><div class="frame corners" aria-hidden="true"></div>'+
  '<button class="shutter" id="bCam" aria-label="Prendre une photo de facture"><span>'+I.cam+'</span></button>'+
  '<div class="lbl">Prendre une photo</div><div class="hint">Une facture par photo, bien à plat et lisible.</div></div>'+
  '<div class="row" style="margin-top:0"><button class="btn" id="bFiles">'+I.img+'Galerie</button><button class="btn" id="bDemo">Exemples</button></div>'+
  (enCours?'<div class="busy"><div class="spin"></div>'+enCours+' lecture'+(enCours>1?'s':'')+' en cours…</div>':"")+'</div><div>'+
  (nv?'<div class="card go" id="goV" role="button" tabindex="0"><div><div class="n">'+nv+' facture'+(nv>1?'s':'')+' à vérifier</div><div class="tx">Corrigez au besoin, puis approuvez.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  (pret?'<div class="card go" id="goA" role="button" tabindex="0"><div><div class="n">'+pret+' prête'+(pret>1?'s':'')+' pour NBooks</div><div class="tx">Approuvées, pas encore envoyées.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  (peutInstaller()?'<button class="btn gold full" id="bInstall" style="margin:12px 0 14px">'+ICO_AJOUT+' Installer NCapture sur ce téléphone</button>':"")+
  '<div class="brief"><h3>Comment ça marche</h3><ol><li>Vous cadrez la facture et prenez la photo.</li><li>'+(CFG.mode==="ia"?"L’IA lit le fournisseur et les montants ; le code refait tous les calculs.":"Démo : vos photos ne sont pas lues (vous saisissez les montants) ; le bouton Exemples montre une lecture type.")+'</li><li>Vous corrigez au besoin, vous approuvez, puis NBooks crée la facture fournisseur.</li></ol></div>'+
  '</div></div>';
}
function ton(a){return /balance|illisible|impossible/i.test(a)?"rouge":"orange"}
function carte(i){
  var r=i.r||{}, al=i.alertes||[], tags="", lec=i.etat==="lecture";
  if(i.etat==="verifier"||i.etat==="erreur") tags+=al.length?al.map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join(""):'<span class="tag vert">Vérifiée</span>';
  if(i.etat==="approuvee") tags+=i.envoye?'<span class="tag draft">'+esc(i.envoye)+'</span>':'<span class="tag vert">Approuvée</span>';
  if(i.cat) tags+='<span class="tag">'+esc(i.cat)+'</span>';
  return '<div class="card item'+(lec?' lecture':'')+(i.neuf?' lit':'')+'" data-id="'+i.id+'"><div class="ph'+(lec?' scan':'')+'">'+(i.thumb?'<img src="'+i.thumb+'" alt="">':'')+'</div>'+
  '<div><div class="n">'+esc(r.fournisseur||(i.etat==="erreur"?"Lecture impossible":lec?"Lecture en cours…":"Fournisseur à saisir"))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.numero?" · "+esc(r.numero):"")+'</div>'+
  (r.total!=null?'<div class="tx">TPS '+money(r.tps)+' · TVQ '+money(r.tvq)+'</div>':"")+'</div>'+
  '<div class="tot">'+(r.total!=null?money(r.total):"")+'</div>'+
  (tags?'<div class="tags">'+tags+'</div>':'')+'</div>';
}
function vListe(etat,titre,sous){
  var l=items.filter(function(i){return i.etat===etat||(etat==="verifier"&&(i.etat==="erreur"||i.etat==="lecture"))});
  var head='<p class="eyebrow">'+(etat==="verifier"?"File d’approbation":"Prêtes pour la comptabilité")+'</p><h1>'+titre+'</h1><p class="sub">'+sous+'</p>';
  if(etat==="approuvee"&&l.length){var ne=l.filter(function(i){return !i.envoye}).length;head+=ne?'<button class="btn gold full" id="bSendAll" style="margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à NBooks</button>':'<div class="brief" style="text-align:center;font-weight:600">Tout est envoyé à NBooks.</div>';}
  return head+(l.length?'<div class="list">'+l.map(carte).join("")+'</div>':'<div class="empty">Rien ici pour l\'instant.</div>');
}
function totaux(l){var t={n:l.length,sub:0,tps:0,tvq:0,pb:0,tot:0};l.forEach(function(i){var r=i.r;t.sub+=cents(r.sous_total);t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.pb+=cents(r.pourboire);t.tot+=cents(r.total)});return t}
function vExporter(){
  var l=items.filter(function(i){return i.etat==="approuvee"}), t=totaux(l);
  var cti=lignes().reduce(function(s,o){return s+cents(o["CTI réclamable"])+cents(o["RTI réclamable"])},0);
  return '<p class="eyebrow">Comptabilité</p><h1>Exporter</h1><p class="sub">Les factures approuvées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi hero"><small>Total approuvé</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>CTI + RTI</small><b>'+money(cti/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><button class="btn gold" id="bXlsx"'+(t.n?"":" disabled")+'>Excel (.xlsx)</button><button class="btn" id="bCsv"'+(t.n?"":" disabled")+'>CSV</button></div>'+
  '<div class="row"><button class="btn ghost" id="bVider">'+(SRV?"Archiver les factures envoyées à NBooks":"Vider la liste")+'</button></div>'+

  L.forEach(function(p){x.font=(p[0]==="TOTAL"?"bold 26px":"22px")+" monospace";x.fillText(p[0],40,y);x.textAlign="right";x.fillText(p[1]+" $",480,y);x.textAlign="left";y+=44});

  return cv}
function demo(){
  EX.forEach(function(e,k){recu(e).toBlob(function(b){var f=new File([b],"exemple-"+k+".jpg",{type:"image/jpeg"});setTimeout(function(){lire(f,k)},k*300)},"image/jpeg",.85)});
  view="verifier"; setTimeout(render,50);
}
$("cam").onchange=function(){[].slice.call(this.files).forEach(function(f){lire(f)});this.value="";view="verifier";render()};
$("files").onchange=$("cam").onchange;
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();window.scrollTo(0,0)});

function demanderCode(){
  $("sheetIn").innerHTML='<div class="grab"></div><div class="form" style="grid-column:1/-1"><p class="eyebrow">Accès</p><h1>Code d\'accès</h1><p class="sub">Entrez le code fourni par l\'équipe NEKHEVI.</p><label for="fc">Code</label><input id="fc" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div><div class="acts two"><button class="btn ghost" id="bcX">Annuler</button><button class="btn gold" id="bc">Continuer</button></div>';
  $("sheet").classList.add("on"); $("bcX").onclick=fermer;
  $("bc").onclick=function(){var v=$("fc").value.trim();if(v){try{localStorage.setItem(CODEKEY,v)}catch(e){}fermer();toast("Code enregistré");if(view==="reglages")render()}};
  $("fc").addEventListener("keydown",function(e){if(e.key==="Enter"||e.keyCode===13){e.preventDefault();$("bc").click()}});
  $("fc").addEventListener("focus",function(){setTimeout(function(){$("bc").scrollIntoView({block:"nearest"})},300)});
}

/* ---- connexion NEKHEVI et entreprise active ---- */
var J=function(r){return r.json().catch(function(){return{}})};
function api(url,opt){opt=opt||{};opt.headers=H();opt.credentials="same-origin";return fetch(url,opt)}
function porte(html){porteOuverte=true;document.body.classList.add("sans-nav");$("org").hidden=true;fermer();
  $("view").innerHTML='<div class="porte"><img src="/brand/ncapture-icone.svg" alt="">'+html+'</div>'}
function ecranConnexion(msg){
  var lien=(CFG.app||"https://app.nekhevi.com")+"/ncapture";
  porte('<p class="eyebrow" style="margin-top:14px">NEKHEVI</p><h1>Connexion</h1><p class="sub">'+(msg||"NCapture s’ouvre avec votre compte NEKHEVI. Vos factures restent dans l’espace de votre entreprise.")+'</p>'+
    '<a class="btn gold full" id="bConn" href="'+esc(lien)+'">Se connecter avec NEKHEVI</a>'+
    '<p class="note" style="margin-top:14px">Vous passez par app.nekhevi.com, puis vous revenez ici automatiquement.</p>'+
    (CFG.code?'<button class="btn ghost full" id="bRepli" style="margin-top:10px">Utiliser un code d’accès (dépannage)</button>':''));
  var b=$("bRepli"); if(b) b.onclick=function(){SRV=false;ORG=null;porteOuverte=false;document.body.classList.remove("sans-nav");items=load();render();if(!code())demanderCode()};
}
function ecranMfa(){
  porte('<p class="eyebrow" style="margin-top:14px">Double authentification</p><h1>Code de vérification</h1><p class="sub">Entrez le code à 6 chiffres de votre application d’authentification.</p>'+
    '<form id="fMfa"><label for="fCode" class="sr">Code</label><input id="fCode" class="code6" inputmode="numeric" autocomplete="one-time-code" maxlength="7" pattern="[0-9 ]*" enterkeyhint="go">'+
    '<button class="btn gold full" type="submit">Continuer</button></form>');
  $("fCode").focus();
  $("fMfa").onsubmit=function(e){e.preventDefault();var v=$("fCode").value.replace(/\s/g,"");if(!/^\d{6}$/.test(v))return toast("6 chiffres");
    api("/api/session",{method:"POST",body:JSON.stringify({code:v})}).then(function(r){if(!r.ok){toast("Code refusé, réessayez");$("fCode").value="";return}demarrerSession()})};
}
function sessionPerdue(){if(!SRV)return;items=[];synchro={};ecranConnexion("Votre session a pris fin. Reconnectez-vous pour continuer.")}
function deconnexion(){api("/api/session",{method:"DELETE"}).then(function(){try{localStorage.removeItem(ORGKEY)}catch(e){}items=[];synchro={};ORG=null;ecranConnexion("Vous êtes déconnecté.")})}
var ICO_BAS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var COULEUR=/^#[0-9A-Fa-f]{6}$/;
function majOrgChip(){var c=$("org");if(!ORG){c.hidden=true;return}
  c.hidden=false;c.style.setProperty("--org",COULEUR.test(ORG.couleur||"")?ORG.couleur:"var(--nk-accent)");
  c.innerHTML='<i></i><span>'+esc(ORG.nom)+'</span>'+(SEL?ICO_BAS:"");c.dataset.sel=SEL?"1":"0";
  c.setAttribute("aria-label","Entreprise active : "+ORG.nom+(SEL?". Toucher pour changer.":""));c.onclick=SEL?choisirOrg:null}
function choisirOrg(){if(!SEL)return;
  $("sheetIn").innerHTML='<div class="grab"></div><div class="form" style="grid-column:1/-1"><p class="eyebrow">Bêta</p><h1>Choisir l’entreprise</h1>'+
    '<p class="sub">Les factures de chaque entreprise restent séparées.</p><div class="orglist">'+
    ORGS.map(function(o){var col=COULEUR.test(o.couleur||"")?o.couleur:"var(--nk-accent)";return '<button type="button" data-org="'+esc(o.id)+'" style="--org:'+col+'" aria-current="'+(ORG&&ORG.id===o.id)+'"><i></i><span>'+esc(o.nom)+'<small>'+esc({owner:"Propriétaire",admin:"Administrateur",member:"Membre",viewer:"Lecteur"}[o.role]||o.role)+'</small></span></button>'}).join("")+
    '</div></div><div class="acts"><button class="btn" id="bOrgX">Fermer</button></div>';
  $("sheet").classList.add("on");$("bOrgX").onclick=fermer;
  $("sheetIn").querySelectorAll("[data-org]").forEach(function(b){b.onclick=function(){var o=ORGS.find(function(x){return x.id===b.dataset.org});fermer();if(o&&(!ORG||o.id!==ORG.id))activerOrg(o)}});
}
function activerOrg(o){ORG=o;try{localStorage.setItem(ORGKEY,o.id)}catch(e){}items=[];synchro={};majOrgChip();render();chargerDocs();toast("Entreprise : "+o.nom)}
function chargerDocs(){var org=ORG&&ORG.id;
  return api("/api/documents").then(function(r){if(r.status===401){sessionPerdue();throw 0}if(!r.ok)throw 0;return r.json()}).then(function(j){
    if(!ORG||ORG.id!==org)return;
    var locaux=items.filter(function(i){return !i.srv});
    items=locaux.concat((j.documents||[]).map(function(d){d.srv=true;synchro[d.id]=snap(d);return d}));render();
  }).catch(function(){if(SRV&&!porteOuverte)toast("Factures non chargées : vérifiez la connexion")});
}
function demarrerSession(){
  var h=location.hash.slice(1), q=new URLSearchParams(h), th=q.get("nc_th"), orgVoulue=q.get("org");
  if(h) history.replaceState(null,"",location.pathname+location.search);
  var etape=th?api("/api/session",{method:"POST",body:JSON.stringify({token_hash:th})}).then(function(r){if(!r.ok)toast("Lien de connexion expiré : reconnectez-vous")}):Promise.resolve();
  return etape.then(function(){return api("/api/session")}).then(J).then(function(s){
    if(!s.connecte) return ecranConnexion();
    if(s.mfa) return ecranMfa();
    return api("/api/moi").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){
      MOI=m;ORGS=m.orgs||[];SEL=!!m.selecteur;
      if(!ORGS.length) return porte('<h1 style="margin-top:14px">Aucune entreprise</h1><p class="sub">Votre compte NEKHEVI n’est relié à aucune entreprise. Demandez une invitation au propriétaire.</p><button class="btn full" id="bSortie2">Se déconnecter</button>'),$("bSortie2").onclick=deconnexion;
      var mem=null;try{mem=localStorage.getItem(ORGKEY)}catch(e){}
      var o=ORGS.find(function(x){return x.id===orgVoulue})||ORGS.find(function(x){return x.id===mem})||ORGS[0];
      SRV=true;porteOuverte=false;document.body.classList.remove("sans-nav");activerOrg(o);
    });
  }).catch(function(){ecranConnexion("Connexion impossible pour l’instant. Réessayez dans un moment.")});
}

items.forEach(function(i){if(i.etat==="lecture")i.etat="erreur"});
fetch("/categories.json").then(function(r){return r.json()}).then(function(c){CATS=c}).catch(function(){});
fetch("/api/config").then(function(r){return r.json()}).then(function(c){CFG=c}).catch(function(){}).then(function(){
  var p=$("mode");p.textContent=CFG.mode==="ia"?"Lecture IA":"Démo";p.className="tag "+(CFG.mode==="ia"?"vert":"draft");
  if(CFG.auth==="nekhevi"){items=[];return demarrerSession()}
  items=load(); items.forEach(function(i){if(i.etat==="lecture")i.etat="erreur"});
  if(CFG.code&&!code())demanderCode(); render();
});
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){})}
var q=new URLSearchParams(location.search); if(q.get("vue")) view=q.get("vue");
render(); NC.demarrer();
})();
</script>
