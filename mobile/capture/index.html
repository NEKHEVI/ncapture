<body>
<div class="splash" id="splash" aria-hidden="true"><div class="b"><img src="/brand/ncapture-marque-fond-sombre.svg" alt=""><b><i>N</i>Capture</b><div class="bar"></div></div></div>
<header class="top">
  <a class="logo" href="/capture" aria-label="NCapture, accueil"><img class="lg-d" src="/brand/ncapture-marque-fond-sombre.svg" alt=""><img class="lg-l" src="/brand/ncapture-marque-fond-clair.svg" alt=""><b><i>N</i>Capture</b></a>

  <button data-v="capturer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>Capturer</button>
  <button data-v="verifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l9 15.5H3z"/><path d="M12 10v4M12 16.8v.4"/></svg>À vérifier<span class="badge" id="bv" hidden></span></button>
  <button data-v="approuvees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Approuvées</button>
  <button data-v="exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Exporter</button>
  <button data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>

<input type="file" id="files" accept="image/*" multiple hidden>

<script src="/ncapture-ui.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="ncapture-v1", CODEKEY="ncapture-code";
var CFG={mode:"demo",code:false}, CATS=[], view="capturer", n=0, ouvertId=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("rbooks-capture-v1"))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("Mémoire du téléphone pleine : exportez et videz la liste.")}}
var items=load();
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var cents=function(x){return Math.round((Number(x)||0)*100)};
var money=function(x){return (Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}
function code(){try{return localStorage.getItem(CODEKEY)||localStorage.getItem("rbooks-capture-code")}catch(e){return null}}

/* ---- règles de vérification (reprises du pipeline Python, inchangées) ---- */
function categorie(r){
  // Le nom du fournisseur décide d'abord ; les articles servent seulement d'indice (signalé à l'usager).
  var four=(r.fournisseur||"").toLowerCase(), art=(r.articles||[]).join(" ").toLowerCase(), best=null, bn=0, parArt=false;
  CATS.forEach(function(c){var kf=0,ka=0;(c.motifs||[]).forEach(function(m){try{var re=new RegExp(m,"i");if(re.test(four))kf++;else if(re.test(art))ka++}catch(e){}});var k=kf*10+ka;if(k>bn){bn=k;best=c;parArt=kf===0}});
  if(!best||!four.trim()) return {code:"5900",nom:"À classer",cti_rti:1,doute:true};
  return {code:best.code,nom:best.nom,cti_rti:best.cti_rti,doute:parArt||/^À classer/.test(best.nom)};
}
function verifier(r){
  var a=[], sub=cents(r.sous_total), tps=cents(r.tps), tvq=cents(r.tvq), pb=cents(r.pourboire), tot=cents(r.total);
  if(Math.abs(sub+tps+tvq+pb-tot)>3) a.push("Le total ne balance pas ("+money((sub+tps+tvq+pb)/100)+" calculé)");
  if(sub>0 && tps>0 && Math.abs(tps-Math.round(sub*0.05))>2) a.push("TPS différente de 5 %");
  if(sub>0 && tvq>0 && Math.abs(tvq-Math.round(sub*0.09975))>2) a.push("TVQ différente de 9,975 %");
  if((tps>0||tvq>0) && (!r.no_tps||!r.no_tvq)) a.push("Pas de nos de taxe : CTI/RTI non réclamables");
  if(sub>0 && pb>sub*0.25) a.push("Pourboire de plus de 25 %");
  if(!r.date) a.push("Date illisible");
  if((Number(r.confiance)||1)<0.8) a.push("Lecture incertaine");
  return a;
}
function enrichir(it){
  var c=categorie(it.r); it.cat=it.catManuelle||(c.code+" "+c.nom); it.cti=it.catManuelle?ctiDe(it.catManuelle):c.cti_rti;
  it.alertes=verifier(it.r);
  if(it.cti<1) it.alertes.push("Repas : 50 % des CTI/RTI");
  if(c.doute&&!it.catManuelle) it.alertes.push("Catégorie à confirmer");
  if(it.mode==="non-lu") it.alertes.unshift("Photo non lue (mode démo) : saisissez le fournisseur et les montants");
  else if((Number(it.r.confiance)||0)<0.8) it.alertes.push("Lecture incertaine : comparez avec la photo");
  return it;
}
function ctiDe(cat){var c=CATS.find(function(x){return (x.code+" "+x.nom)===cat});return c?c.cti_rti:1}

/* ---- image : réduite sur le téléphone avant l'envoi ---- */
function reduire(file,max,q){return new Promise(function(ok,ko){
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",q))};
  img.onerror=ko; img.src=u;
})}

function lire(file,idx){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var it={id:id,etat:"lecture",ajout:new Date().toISOString(),thumb:"",r:{},alertes:[]};
  items.unshift(it); n++; render();
  return Promise.all([reduire(file,1600,.82),reduire(file,360,.7)]).then(function(v){
    it.thumb=v[1]; render();
    var h={"Content-Type":"application/json"}, c=code(); if(c) h["x-capture-code"]=c;
    return fetch("/api/lire",{method:"POST",headers:h,body:JSON.stringify(idx==null?{image:v[0]}:{image:v[0],index:idx,demo:true})});
  }).then(function(r){
    if(r.status===401){try{localStorage.removeItem(CODEKEY)}catch(e){}throw new Error("code")}
    if(!r.ok) throw new Error("lecture");
    return r.json();
  }).then(function(j){
    it.mode=j.mode; it.modele=j.modele; it.r=j.resultat||{}; it.etat="verifier"; it.neuf=true; enrichir(it);
    save(); render(); if(ouvertId===it.id) ouvrir(it.id); toast(it.alertes.length?"Lue : "+it.alertes.length+" point(s) à vérifier":"Lue et vérifiée");
  }).catch(function(e){
    it.etat="erreur"; save(); render();
    toast(e.message==="code"?"Code d'accès requis":"Lecture impossible, réessayez");
    if(e.message==="code") demanderCode();
  });
}

/* ---- vues ---- */
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view);if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  var nv=items.filter(function(i){return i.etat==="verifier"}).length, bv=$("bv"); bv.hidden=!nv; bv.textContent=nv;
  var v=$("view");
  if(view==="capturer") v.innerHTML=vCapturer();
  if(view==="verifier") v.innerHTML=vListe("verifier","À vérifier","Touchez une facture pour corriger les montants, puis approuvez-la.");
  if(view==="approuvees") v.innerHTML=vListe("approuvee","Approuvées","Prêtes pour NBooks. Elles apparaissent aussitôt sur la page NBooks de l’ordinateur.");
  if(view==="exporter") v.innerHTML=vExporter();
  if(view==="reglages") v.innerHTML=NC.vueReglages({extra:vReglagesApp(),version:"Version mobile.",licence:"/LICENSE.txt"});
  bind();
  items.forEach(function(i){i.neuf=false});
}
function vCapturer(){
  var enCours=items.filter(function(i){return i.etat==="lecture"}).length, nv=items.filter(function(i){return i.etat==="verifier"}).length, I=NC.icones;
  var pret=items.filter(function(i){return i.etat==="approuvee"&&!i.envoye}).length;
  return '<p class="eyebrow">Entreprise Démo inc.</p><h1>Capture de factures</h1><p class="sub">Photographiez vos factures et vos reçus : NCapture lit le fournisseur et les montants, vérifie la TPS et la TVQ, et prépare tout pour NBooks.</p>'+
  '<div class="home"><div>'+
  '<div class="shoot"><div class="frame corners" aria-hidden="true"></div>'+
  '<button class="shutter" id="bCam" aria-label="Prendre une photo de facture"><span>'+I.cam+'</span></button>'+
  '<div class="lbl">Prendre une photo</div><div class="hint">Une facture par photo, bien à plat et lisible.</div></div>'+
  '<div class="row" style="margin-top:0"><button class="btn" id="bFiles">'+I.img+'Galerie</button><button class="btn" id="bDemo">Exemples</button></div>'+
  (enCours?'<div class="busy"><div class="spin"></div>'+enCours+' lecture'+(enCours>1?'s':'')+' en cours…</div>':"")+'</div><div>'+
  (nv?'<div class="card go" id="goV" role="button" tabindex="0"><div><div class="n">'+nv+' facture'+(nv>1?'s':'')+' à vérifier</div><div class="tx">Corrigez au besoin, puis approuvez.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  (pret?'<div class="card go" id="goA" role="button" tabindex="0"><div><div class="n">'+pret+' prête'+(pret>1?'s':'')+' pour NBooks</div><div class="tx">Approuvées, pas encore envoyées.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  '<div class="brief"><h3>Comment ça marche</h3><ol><li>Vous cadrez la facture et prenez la photo.</li><li>'+(CFG.mode==="ia"?"L’IA lit le fournisseur et les montants ; le code refait tous les calculs.":"Démo : vos photos ne sont pas lues (vous saisissez les montants) ; le bouton Exemples montre une lecture type.")+'</li><li>Vous corrigez au besoin, vous approuvez, puis NBooks crée la facture fournisseur.</li></ol></div>'+
  '</div></div>';
}
function ton(a){return /balance|illisible|impossible/i.test(a)?"rouge":"orange"}
function carte(i){
  var r=i.r||{}, al=i.alertes||[], tags="", lec=i.etat==="lecture";
  if(i.etat==="verifier"||i.etat==="erreur") tags+=al.length?al.map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join(""):'<span class="tag vert">Vérifiée</span>';
  if(i.etat==="approuvee") tags+=i.envoye?'<span class="tag draft">'+esc(i.envoye)+'</span>':'<span class="tag vert">Approuvée</span>';
  if(i.cat) tags+='<span class="tag">'+esc(i.cat)+'</span>';
  return '<div class="card item'+(lec?' lecture':'')+(i.neuf?' lit':'')+'" data-id="'+i.id+'"><div class="ph'+(lec?' scan':'')+'">'+(i.thumb?'<img src="'+i.thumb+'" alt="">':'')+'</div>'+
  '<div><div class="n">'+esc(r.fournisseur||(i.etat==="erreur"?"Lecture impossible":lec?"Lecture en cours…":"Fournisseur à saisir"))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.numero?" · "+esc(r.numero):"")+'</div>'+
  (r.total!=null?'<div class="tx">TPS '+money(r.tps)+' · TVQ '+money(r.tvq)+'</div>':"")+'</div>'+
  '<div class="tot">'+(r.total!=null?money(r.total):"")+'</div>'+
  (tags?'<div class="tags">'+tags+'</div>':'')+'</div>';
}
function vListe(etat,titre,sous){
  var l=items.filter(function(i){return i.etat===etat||(etat==="verifier"&&(i.etat==="erreur"||i.etat==="lecture"))});
  var head='<p class="eyebrow">'+(etat==="verifier"?"File d’approbation":"Prêtes pour la comptabilité")+'</p><h1>'+titre+'</h1><p class="sub">'+sous+'</p>';
  if(etat==="approuvee"&&l.length){var ne=l.filter(function(i){return !i.envoye}).length;head+=ne?'<button class="btn gold full" id="bSendAll" style="margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à NBooks</button>':'<div class="brief" style="text-align:center;font-weight:600">Tout est envoyé à NBooks.</div>';}
  return head+(l.length?'<div class="list">'+l.map(carte).join("")+'</div>':'<div class="empty">Rien ici pour l\'instant.</div>');
}
function totaux(l){var t={n:l.length,sub:0,tps:0,tvq:0,pb:0,tot:0};l.forEach(function(i){var r=i.r;t.sub+=cents(r.sous_total);t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.pb+=cents(r.pourboire);t.tot+=cents(r.total)});return t}
function vExporter(){
  var l=items.filter(function(i){return i.etat==="approuvee"}), t=totaux(l);
  var cti=lignes().reduce(function(s,o){return s+cents(o["CTI réclamable"])+cents(o["RTI réclamable"])},0);
  return '<p class="eyebrow">Comptabilité</p><h1>Exporter</h1><p class="sub">Les factures approuvées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi hero"><small>Total approuvé</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>CTI + RTI</small><b>'+money(cti/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><button class="btn gold" id="bXlsx"'+(t.n?"":" disabled")+'>Excel (.xlsx)</button><button class="btn" id="bCsv"'+(t.n?"":" disabled")+'>CSV</button></div>'+
  '<div class="row"><button class="btn ghost" id="bVider">Vider la liste</button></div>'+
  '<p class="note">L\'Excel contient une feuille par mois et une feuille TPS/TVQ (CTI et RTI réclamables, repas à 50 %).</p>';
}
function vReglagesApp(){
  return '<div class="sec">Accès</div><div class="card"><div class="kv"><span>Lecture</span><b>'+(CFG.mode==="ia"?"IA (Claude)":"Démo, sans IA")+'</b></div>'+
  '<div class="kv"><span>Code d’accès</span><b>'+(CFG.code?(code()?"Enregistré":"Exigé"):"Non exigé")+'</b></div>'+
  (CFG.code?'<div class="row"><button class="btn" id="bCode">'+(code()?"Changer le code":"Entrer le code")+'</button></div>':'')+'</div>';
}

/* ---- fiche : lecture et correction au pouce ---- */
var MONT=["sous_total","tps","tvq","pourboire","total"], TXT=["fournisseur","date","numero","no_tps","no_tvq"];
var NOMS={sous_total:"Sous-total",tps:"TPS 5 %",tvq:"TVQ 9,975 %",pourboire:"Pourboire",total:"Total"};
var vNum=function(x){return x==null||x===""?"":String(Number(x).toFixed(2)).replace(".",",")};
var pNum=function(s){return Number(String(s).replace(/\s/g,"").replace(",","."))||0};
function ouvrir(id){
  var i=items.find(function(x){return x.id===id}); if(!i) return;
  var r=i.r||{}, lec=i.etat==="lecture"; ouvertId=id;
  var opts=CATS.map(function(c){var v=c.code+" "+c.nom;return '<option'+(v===i.cat?' selected':'')+'>'+esc(v)+'</option>'}).join("");
  if(i.cat&&!CATS.some(function(c){return (c.code+" "+c.nom)===i.cat})) opts='<option selected>'+esc(i.cat)+'</option>'+opts;
  var t=function(k,l,im){return '<div><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" inputmode="'+(im||"text")+'" autocomplete="off" value="'+esc(r[k]==null?"":r[k])+'"></div>'};
  var f=function(k){return '<div class="fig'+(k==="total"?' total':'')+'" id="g_'+k+'"><label for="f_'+k+'">'+NOMS[k]+'</label><input id="f_'+k+'" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="'+vNum(r[k])+'" placeholder="0,00"></div>'};
  $("sheetIn").innerHTML='<div class="grab"></div>'+
  '<div class="side"><div class="ph-big'+(lec?' scan':'')+'">'+(i.thumb?'<img src="'+i.thumb+'" alt="Photo de la facture">':'')+'</div><div class="tags" id="fTags" style="margin:0 0 4px"></div>'+
  ((i.photos&&i.photos.length)?'<div class="tags" style="margin:4px 0">'+i.photos.map(function(p,k){return '<img src="'+p+'" alt="Photo '+(k+2)+'" style="height:56px;width:auto;border-radius:8px;border:1px solid var(--nk-border)">'}).join("")+'</div>':'')+
  (!lec&&i.etat!=="approuvee"?'<div style="margin:6px 0 4px"><button type="button" class="btn" id="bRe" style="width:100%">Reprendre une photo pour compléter</button><p class="note" style="margin:6px 0 0">Il manque une date, un montant ou un numéro ? Photographiez la partie manquante : seuls les champs vides sont remplis, rien de ce que vous avez saisi n’est remplacé.</p><input type="file" id="fRe" accept="image/*" capture="environment" hidden></div>':'')+
  '</div>'+
  '<div class="form"><p class="eyebrow" style="margin:6px 0 0">'+(lec?"Lecture en cours…":i.etat==="approuvee"?"Approuvée":"Vérifiez la lecture")+'</p>'+
  '<div class="who"><label for="f_fournisseur" class="sr">Fournisseur</label><input id="f_fournisseur" autocomplete="off" placeholder="Fournisseur" value="'+esc(r.fournisseur||"")+'"></div>'+
  '<div class="g2">'+t("date","Date (AAAA-MM-JJ)")+t("numero","No de facture")+'</div>'+
  '<div class="figs">'+MONT.map(f).join("")+'</div><p class="note" id="fCalc" style="margin:-4px 0 6px"></p>'+
  '<label for="f_cat">Catégorie</label><select id="f_cat">'+opts+'</select>'+
  '<details class="plus"'+((r.no_tps||r.no_tvq)?'':' open')+'><summary>Numéros de taxe (CTI / RTI)</summary><div class="g2">'+t("no_tps","No TPS")+t("no_tvq","No TVQ")+'</div></details></div>'+
  '<div class="acts"><button class="btn ghost danger" id="bRej" aria-label="Rejeter la facture">Rejeter</button><button class="btn" id="bSave">Enregistrer</button>'+(i.etat!=="approuvee"?'<button class="btn gold" id="bOk">Approuver</button>':'<button class="btn" id="bFerm">Fermer</button>')+'</div>';
  $("sheet").classList.add("on");
  var lireForm=function(){TXT.forEach(function(k){r[k]=$("f_"+k).value.trim()});MONT.forEach(function(k){r[k]=pNum($("f_"+k).value)});i.r=r;
    var cs=$("f_cat").value, auto=categorie(r); i.catManuelle=(cs&&cs!==(auto.code+" "+auto.nom))?cs:null; enrichir(i)};
  var maj=function(){lireForm();
    $("fTags").innerHTML=(i.alertes||[]).map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join("")+(!i.alertes.length?'<span class="tag vert">Montants vérifiés</span>':'')+(i.modele&&i.modele!=="aucun"?'<span class="tag">Lu par : '+esc(i.modele)+'</span>':"");
    var s=cents(r.sous_total)+cents(r.tps)+cents(r.tvq)+cents(r.pourboire), ok=Math.abs(s-cents(r.total))<=3;
    $("g_total").classList.toggle("bad",!ok&&s>0);
    $("fCalc").innerHTML=!ok&&s>0?'Somme des montants : <b>'+money(s/100)+'</b> <button type="button" class="lnk" id="bSum" style="height:32px;margin-left:6px">Utiliser</button>':"";
    var b=$("bSum"); if(b) b.onclick=function(){$("f_total").value=vNum(s/100);maj()};
  };
  if(lec){$("sheetIn").querySelectorAll("input,select,#bSave,#bOk").forEach(function(e){e.disabled=true});$("bRej").onclick=fermer;$("bRej").textContent="Fermer";return}
  maj();
  $("sheetIn").querySelectorAll("input,select").forEach(function(e){e.addEventListener("input",maj);e.addEventListener("change",maj)});
  MONT.forEach(function(k){$("f_"+k).addEventListener("focus",function(){this.select()})});
  $("bSave").onclick=function(){lireForm();save();fermer();render();toast(i.alertes.length?i.alertes.length+" point(s) restant(s)":"Montants vérifiés")};
  if($("bOk")) $("bOk").onclick=function(){lireForm();i.etat="approuvee";save();fermer();render();toast("Approuvée : prête pour NBooks")};
  if($("bFerm")) $("bFerm").onclick=fermer;
  if($("bRe")){ $("bRe").onclick=function(){$("fRe").click()};
    $("fRe").onchange=function(){var fl=this.files&&this.files[0]; this.value=""; if(!fl) return; lireForm(); save(); completer(id,fl)}; }
  $("bRej").onclick=function(){var b=$("bRej");if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmer";return}items=items.filter(function(x){return x.id!==id});save();fermer();render();toast("Facture retirée")};
}

/* 2e photo de la même facture : remplit seulement les champs encore vides */
var NOMS_TXT={fournisseur:"fournisseur",date:"date",numero:"no de facture",no_tps:"no TPS",no_tvq:"no TVQ"};
function completer(id,file){
  var i=items.find(function(x){return x.id===id}); if(!i) return;
  var ph=document.querySelector("#sheetIn .ph-big"); if(ph) ph.classList.add("scan");
  var b=$("bRe"); if(b){b.disabled=true;b.textContent="Lecture de la 2e photo…"}
  Promise.all([reduire(file,1600,.82),reduire(file,360,.7)]).then(function(v){
    i.photos=(i.photos||[]).concat([v[1]]);
    var h={"Content-Type":"application/json"}, c=code(); if(c) h["x-capture-code"]=c;
    return fetch("/api/lire",{method:"POST",headers:h,body:JSON.stringify({image:v[0]})});
  }).then(function(r){
    if(r.status===401){try{localStorage.removeItem(CODEKEY)}catch(e){}throw new Error("code")}
    if(!r.ok) throw new Error("lecture");
    return r.json();
  }).then(function(j){
    if(j.mode==="non-lu") throw new Error("demo");
    var nv=j.resultat||{}, r=i.r||{}, ajout=[];
    TXT.forEach(function(k){if(!String(r[k]==null?"":r[k]).trim()&&String(nv[k]==null?"":nv[k]).trim()){r[k]=String(nv[k]).trim();ajout.push(NOMS_TXT[k])}});
    MONT.forEach(function(k){if(!(Number(r[k])>0)&&Number(nv[k])>0){r[k]=Number(nv[k]);ajout.push(NOMS[k])}});
    var arts=(r.articles||[]).slice(); (nv.articles||[]).forEach(function(a){if(arts.indexOf(a)<0)arts.push(a)}); r.articles=arts;
    if(ajout.length) r.confiance=Math.max(Number(r.confiance)||0,Number(nv.confiance)||0);
    i.r=r; i.mode="ia"; if(j.modele) i.modele=j.modele; enrichir(i); save(); render(); if(ouvertId===id) ouvrir(id);
    toast(ajout.length?"Complétée : "+ajout.join(", "):"Rien de nouveau sur cette photo : saisissez à la main");
  }).catch(function(e){
    save(); if(ouvertId===id) ouvrir(id);
    toast(e.message==="code"?"Code d'accès requis":e.message==="demo"?"Mode démo : photo non lue":"Lecture impossible, réessayez");
    if(e.message==="code") demanderCode();
  });
}

function envoyer(){
  var l=items.filter(function(i){return i.etat==="approuvee"&&!i.envoye});
  if(!l.length) return toast("Tout est déjà envoyé");
  toast("Envoi à NBooks…");
  var h={"Content-Type":"application/json"}, c=code(); if(c) h["x-capture-code"]=c;
  var ok=0, ko=0;
  l.reduce(function(p,i){return p.then(function(){var r=i.r||{};
    return fetch("/api/factures",{method:"POST",headers:h,body:JSON.stringify({cle:i.id,fournisseur:r.fournisseur,date:r.date,numero:r.numero,no_tps:r.no_tps,no_tvq:r.no_tvq,
      sous_total:r.sous_total,tps:r.tps,tvq:r.tvq,pourboire:r.pourboire,total:r.total,categorie:i.cat,cti_rti:i.cti==null?1:i.cti,alertes:i.alertes,thumb:i.thumb})})
    .then(function(x){if(x.status===401){try{localStorage.removeItem(CODEKEY)}catch(e){}throw new Error("code")}if(!x.ok)throw new Error("envoi");return x.json()})
    .then(function(j){i.envoye="Dans NBooks · "+((j.facture&&j.facture.no)||"");i.envoiNo=j.facture&&j.facture.no;ok++;save();render()})
    .catch(function(e){ko++;if(e.message==="code")demanderCode()})})},Promise.resolve())
  .then(function(){toast(ko?(ok+" envoyée(s), "+ko+" en erreur : réessayez"):(ok+" facture"+(ok>1?"s":"")+" dans NBooks"))});
}

/* ---- exports ---- */
function lignes(){
  return items.filter(function(i){return i.etat==="approuvee"}).map(function(i){var r=i.r,cti=i.cti==null?1:i.cti,ok=r.no_tps&&r.no_tvq;
    return {"Date":r.date||"","Fournisseur":r.fournisseur||"","No facture":r.numero||"","Catégorie":i.cat||"","Sous-total":+(r.sous_total||0),"TPS":+(r.tps||0),"TVQ":+(r.tvq||0),"Pourboire":+(r.pourboire||0),"Total":+(r.total||0),
      "CTI réclamable":ok?Math.round((r.tps||0)*cti*100)/100:0,"RTI réclamable":ok?Math.round((r.tvq||0)*cti*100)/100:0,"No TPS":r.no_tps||"","No TVQ":r.no_tvq||"","Alertes":(i.alertes||[]).join(" | ")}});
}
function telecharger(nom,blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function csv(){var L=lignes();if(!L.length)return;var h=Object.keys(L[0]),q=function(v){v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var t=[h.join(";")].concat(L.map(function(o){return h.map(function(k){return q(typeof o[k]==="number"?String(o[k]).replace(".",","):o[k])}).join(";")})).join("\r\n");
  telecharger("ncapture-factures.csv",new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}))}
function xlsx(){var L=lignes();if(!L.length||!window.XLSX)return toast("Excel indisponible hors ligne");var wb=XLSX.utils.book_new(),mois={};
  L.forEach(function(o){var m=(o.Date||"sans-date").slice(0,7);(mois[m]=mois[m]||[]).push(o)});
  Object.keys(mois).sort().forEach(function(m){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mois[m]),m.slice(0,31))});
  var t=totaux(items.filter(function(i){return i.etat==="approuvee"}));
  var tx=[["Résumé des taxes",""],["Factures",t.n],["TPS payée",t.tps/100],["TVQ payée",t.tvq/100],["CTI réclamables",L.reduce(function(s,o){return s+o["CTI réclamable"]},0)],["RTI réclamables",L.reduce(function(s,o){return s+o["RTI réclamable"]},0)],["Total",t.tot/100]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tx),"Taxes TPS-TVQ");XLSX.writeFile(wb,"ncapture-factures.xlsx")}
