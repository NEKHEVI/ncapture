<style>
/* Charte RAWLF « Gold Systems » (docs/DESIGN_DIRECTION.md) — clair et sombre selon le système. */
:root{--bg:#F6F4EF;--card:#FFFFFF;--raised:#FBFAF7;--border:#E6E1D7;--input:#DDD8CD;--divider:#EEEAE2;
--fg:#1A1814;--fg2:#4A463F;--muted:#6B665C;--faint:#77726A;--gold:#D9A441;--on-gold:#120E06;--gold-text:#8A6414;--gold-strong:#6E4F0E;
--brief:#FFF8EA;--brief-b:#E9D3A3;--nav:#F5EBD3;--nav-fg:#6E4F0E;--ok:#1F7A47;--ok-bg:#EAF6EF;--ok-b:#BFE0CC;
--red:#A3321F;--red-bg:#FCEDEA;--red-b:#EDC2B8;--ora:#9A5B0B;--ora-bg:#FDF3E4;--ora-b:#F0D2A6;--draft:#6E4F0E;--draft-bg:#FBF1DA;--draft-b:#E2C98B;--ring:#D9A441}
:root[data-theme="dark"]{--bg:#0E0E0F;--card:#131211;--raised:#151413;--border:#22201C;--input:#262320;--divider:#1C1A17;
--fg:#EDE9E1;--fg2:#C9C3B7;--muted:#A8A193;--faint:#8F897D;--gold-text:#E2B654;--gold-strong:#F3CF7A;--brief:#14120E;--brief-b:#3A3022;--nav:#1A1813;--nav-fg:#F3CF7A;
--ok:#7FD3A0;--ok-bg:#0F1A13;--ok-b:#24412F;--red:#FF9C8A;--red-bg:#1F1210;--red-b:#5C2A22;--ora:#F2B56B;--ora-bg:#1E160C;--ora-b:#5A3F1C;--draft:#F3CF7A;--draft-bg:#1E190F;--draft-b:#5A4620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E0F;--card:#131211;--raised:#151413;--border:#22201C;--input:#262320;--divider:#1C1A17;
--fg:#EDE9E1;--fg2:#C9C3B7;--muted:#A8A193;--faint:#8F897D;--gold-text:#E2B654;--gold-strong:#F3CF7A;--brief:#14120E;--brief-b:#3A3022;--nav:#1A1813;--nav-fg:#F3CF7A;
--ok:#7FD3A0;--ok-bg:#0F1A13;--ok-b:#24412F;--red:#FF9C8A;--red-bg:#1F1210;--red-b:#5C2A22;--ora:#F2B56B;--ora-bg:#1E160C;--ora-b:#5A3F1C;--draft:#F3CF7A;--draft-bg:#1E190F;--draft-b:#5A4620}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:#0E0E0F;display:grid;place-items:center;flex:none}
.mark img{width:22px;height:22px}
.word{font:600 14px Sora,sans-serif;letter-spacing:.3em}
.mod{font:500 13px Manrope;color:var(--muted);padding-left:10px;border-left:1px solid var(--border)}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 12px Manrope;line-height:1.2;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--raised);color:var(--fg2)}
.tag.rouge{color:var(--red);background:var(--red-bg);border-color:var(--red-b)}
.tag.orange{color:var(--ora);background:var(--ora-bg);border-color:var(--ora-b)}
.tag.vert{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-b)}
.tag.draft{color:var(--draft);background:var(--draft-bg);border-color:var(--draft-b)}
.top .tag{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:11px}
main{padding:18px 16px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.org{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font:600 14px Manrope;color:var(--fg);margin-bottom:18px}
.org span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{font:600 26px/1.15 Sora,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
h2{font:600 18px/1.25 Sora,sans-serif;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 0 12px}
.brief{background:var(--brief);border:1px solid var(--brief-b);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.brief h3{font:600 14px Sora,sans-serif;margin:0 0 8px;color:var(--gold-strong)}
.brief ol{margin:0;padding-left:20px;color:var(--fg2);font-size:14px}
.brief li{margin:3px 0}
.row{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg);font:600 14.5px Manrope;cursor:pointer;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn:focus-visible,input:focus-visible,nav button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;cursor:pointer}
.item img{width:58px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--raised)}
.item .n{font:500 15.5px Sora,sans-serif;letter-spacing:-.01em}
.item .m{color:var(--muted);font:500 12px "JetBrains Mono",monospace;margin-top:2px}
.item .tx{color:var(--fg2);font-size:13px;margin-top:4px}
.item .tot{font:600 16px Sora,sans-serif;white-space:nowrap;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;grid-column:1/-1}
.empty{text-align:center;color:var(--muted);padding:36px 10px;border:1px dashed var(--border);border-radius:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.kpi small{display:block;font:500 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font:600 21px Sora,sans-serif;letter-spacing:-.01em;margin-top:2px}
.theme{width:36px;height:36px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg2);display:grid;place-items:center;cursor:pointer;flex:none}
.theme svg{width:18px;height:18px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;border-radius:10px;color:var(--muted);font:600 11.5px Manrope;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;position:relative}
nav button svg{width:20px;height:20px}
nav button.on{background:var(--nav);color:var(--nav-fg)}
nav .badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--red);color:#fff;font:700 10px Manrope;border-radius:6px;padding:0 5px;line-height:16px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(14,14,15,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--input);margin:0 auto 14px}
.sheet img.big{width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid var(--border);background:var(--card);margin-bottom:12px}
label{display:block;font:600 12.5px Manrope;color:var(--muted);margin:10px 0 4px}
input{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--input);background:var(--card);color:var(--fg);font:500 16px Manrope}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:20;background:var(--fg);color:var(--bg);border-radius:10px;padding:11px 14px;font:600 14px Manrope;display:none}
.toast.on{display:block}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
@media (max-width:430px){.top .mod{display:none}.top{gap:8px}}
</style>
</head>
<body>
<header class="top"><div class="mark"><img src="/logo.png" alt=""></div><div class="word">RAWLF</div><div class="mod">Capture</div><span class="tag draft" id="mode">…</span><a class="theme" href="/rbooks" target="rbooks" aria-label="Ouvrir RBooks" title="Ouvrir RBooks" style="width:auto;padding:0 10px;font:600 13px Manrope;text-decoration:none;color:var(--gold-text)">RBooks ↗</a><button class="theme" id="bTheme" type="button" aria-label="Changer le thème"></button></header>
<main id="view"></main>
<nav id="nav">
  <button data-v="capturer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Capturer</button>
  <button data-v="verifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>À vérifier<span class="badge" id="bv" hidden></span></button>
  <button data-v="approuvees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Approuvées</button>
  <button data-v="exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Exporter</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="files" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="rbooks-capture-v1", CODEKEY="rbooks-capture-code";
var CFG={mode:"demo",code:false,rbooks:"demo"}, CATS=[], view="capturer", n=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast("Mémoire du téléphone pleine : exportez et videz la liste.")}}
var items=load();
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var cents=function(x){return Math.round((Number(x)||0)*100)};
var money=function(x){return (Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}

/* ---- règles de vérification (reprises du pipeline Python) ---- */
function categorie(r){
  // Le nom du fournisseur décide d'abord ; les articles servent seulement d'indice (signalé à l'usager).
  var four=(r.fournisseur||"").toLowerCase(), art=(r.articles||[]).join(" ").toLowerCase(), best=null, bn=0, parArt=false;
  CATS.forEach(function(c){var kf=0,ka=0;(c.motifs||[]).forEach(function(m){try{var re=new RegExp(m,"i");if(re.test(four))kf++;else if(re.test(art))ka++}catch(e){}});var k=kf*10+ka;if(k>bn){bn=k;best=c;parArt=kf===0}});
  if(!best||!four.trim()) return {code:"5900",nom:"À classer",cti_rti:1,doute:true};
  return {code:best.code,nom:best.nom,cti_rti:best.cti_rti,doute:parArt||/^À classer/.test(best.nom)};
}
function verifier(r){
  var a=[], sub=cents(r.sous_total), tps=cents(r.tps), tvq=cents(r.tvq), pb=cents(r.pourboire), tot=cents(r.total);
  if(Math.abs(sub+tps+tvq+pb-tot)>3) a.push("Le total ne balance pas ("+money((sub+tps+tvq+pb)/100)+" calculé)");
  if(sub>0 && tps>0 && Math.abs(tps-Math.round(sub*0.05))>2) a.push("TPS différente de 5 %");
  if(sub>0 && tvq>0 && Math.abs(tvq-Math.round(sub*0.09975))>2) a.push("TVQ différente de 9,975 %");
  if((tps>0||tvq>0) && (!r.no_tps||!r.no_tvq)) a.push("Pas de nos de taxe : CTI/RTI non réclamables");
  if(sub>0 && pb>sub*0.25) a.push("Pourboire de plus de 25 %");
  if(!r.date) a.push("Date illisible");
  if((Number(r.confiance)||1)<0.8) a.push("Lecture incertaine");
  return a;
}
function enrichir(it){
  var c=categorie(it.r); it.cat=c.code+" "+c.nom; it.cti=c.cti_rti;
  it.alertes=verifier(it.r);
  if(c.cti_rti<1) it.alertes.push("Repas : 50 % des CTI/RTI");
  if(c.doute) it.alertes.push("Catégorie à confirmer");
  if(it.mode==="non-lu") it.alertes.unshift("Photo non lue (mode démo) : saisissez le fournisseur et les montants");
  else if((Number(it.r.confiance)||0)<0.8) it.alertes.push("Lecture incertaine : comparez avec la photo");
  return it;
}

/* ---- image : réduite sur le téléphone avant l'envoi ---- */
function reduire(file,max,q){return new Promise(function(ok,ko){
  var img=new Image(), u=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL("image/jpeg",q))};
  img.onerror=ko; img.src=u;
})}

function lire(file,idx){
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var it={id:id,etat:"lecture",ajout:new Date().toISOString(),thumb:"",r:{},alertes:[]};
  items.unshift(it); n++; render();
  return Promise.all([reduire(file,1600,.82),reduire(file,360,.7)]).then(function(v){
    it.thumb=v[1]; render();
    var h={"Content-Type":"application/json"}, code=localStorage.getItem(CODEKEY); if(code) h["x-capture-code"]=code;
    return fetch("/api/lire",{method:"POST",headers:h,body:JSON.stringify(idx==null?{image:v[0]}:{image:v[0],index:idx,demo:true})});
  }).then(function(r){
    if(r.status===401){localStorage.removeItem(CODEKEY);throw new Error("code")}
    if(!r.ok) throw new Error("lecture");
    return r.json();
  }).then(function(j){
    it.mode=j.mode; it.modele=j.modele; it.r=j.resultat||{}; it.etat="verifier"; enrichir(it);
    save(); render(); toast(it.alertes.length?"Lue : "+it.alertes.length+" point(s) à vérifier":"Lue et vérifiée");
  }).catch(function(e){
    it.etat="erreur"; save(); render();
    toast(e.message==="code"?"Code d'accès requis":"Lecture impossible, réessayez");
    if(e.message==="code") demanderCode();
  });
}

/* ---- vues ---- */
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view)});
  var nv=items.filter(function(i){return i.etat==="verifier"}).length, bv=$("bv"); bv.hidden=!nv; bv.textContent=nv;
  var v=$("view");
  if(view==="capturer") v.innerHTML=vCapturer();
  if(view==="verifier") v.innerHTML=vListe("verifier","À vérifier","Touchez une facture pour corriger les montants, puis approuvez-la.");
  if(view==="approuvees") v.innerHTML=vListe("approuvee","Approuvées","Prêtes à envoyer dans RBooks. Elles apparaissent aussitôt sur la page RBooks de l\u2019ordinateur.");
  if(view==="exporter") v.innerHTML=vExporter();
  bind();
}
function vCapturer(){
  var enCours=items.filter(function(i){return i.etat==="lecture"}).length, nv=items.filter(function(i){return i.etat==="verifier"}).length;
  var cam='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  return '<button class="org" type="button"><span>Entreprise Démo RBooks inc.</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>'+
  '<h1>Capture de factures</h1><p class="sub">Photographiez vos factures et vos reçus : RBooks les lit, vérifie la TPS et la TVQ, et les prépare pour la comptabilité.</p>'+
  '<div class="card"><h2>Nouvelle facture</h2><p class="sub" style="margin-bottom:14px">Une facture par photo, bien à plat et lisible.</p>'+
  '<button class="btn gold full" id="bCam">'+cam+'Prendre une photo</button>'+
  '<div class="row"><button class="btn" id="bFiles">Galerie photo</button><button class="btn" id="bDemo">Exemples</button></div>'+
  (enCours?'<div class="busy" style="margin-top:14px"><div class="spin"></div>'+enCours+' lecture'+(enCours>1?'s':'')+' en cours…</div>':"")+'</div>'+
  (nv?'<div class="card item" id="goV" style="grid-template-columns:1fr auto;align-items:center"><div><div class="n">'+nv+' facture'+(nv>1?'s':'')+' à vérifier</div><div class="tx">Corrigez si besoin, puis approuvez.</div></div><span class="tag orange">Orange</span></div>':"")+
  '<div class="brief"><h3>Comment ça marche</h3><ol><li>Vous prenez la photo.</li><li>'+(CFG.mode==="ia"?"L'IA lit le fournisseur et les montants ; le code refait les calculs.":"Démo : vos photos ne sont pas lues (vous saisissez les montants) ; le bouton Exemples montre une lecture type.")+'</li><li>Vous approuvez, puis RBooks crée la facture fournisseur.</li></ol></div>';
}
function ton(a){return /balance|illisible|impossible/i.test(a)?"rouge":"orange"}
function carte(i){
  var r=i.r||{}, al=i.alertes||[], tags="";
  if(i.etat==="verifier"||i.etat==="erreur") tags+=al.length?al.map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join(""):'<span class="tag vert">Vérifiée</span>';
  if(i.etat==="approuvee") tags+=i.envoye?'<span class="tag draft">'+esc(i.envoye)+'</span>':'<span class="tag vert">Approuvée</span>';
  if(i.cat) tags+='<span class="tag">'+esc(i.cat)+'</span>';
  return '<div class="card item" data-id="'+i.id+'">'+(i.thumb?'<img src="'+i.thumb+'" alt="">':'<img alt="">')+
  '<div><div class="n">'+esc(r.fournisseur||(i.etat==="erreur"?"Lecture impossible":"Lecture…"))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.numero?" · "+esc(r.numero):"")+'</div>'+
  (r.total!=null?'<div class="tx">TPS '+money(r.tps)+' · TVQ '+money(r.tvq)+'</div>':"")+'</div>'+
  '<div class="tot">'+(r.total!=null?money(r.total):"")+'</div>'+
  '<div class="tags">'+tags+'</div></div>';
}
function vListe(etat,titre,sous){
  var l=items.filter(function(i){return i.etat===etat||(etat==="verifier"&&i.etat==="erreur")});
  var head='<h1>'+titre+'</h1><p class="sub">'+sous+'</p>';
  if(etat==="approuvee"&&l.length){var ne=l.filter(function(i){return !i.envoye}).length;head+=ne?'<button class="btn gold full" id="bSendAll" style="margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à RBooks</button>':'<div class="brief" style="text-align:center;font-weight:600">Tout est envoyé à RBooks.</div>';}
  return head+(l.length?l.map(carte).join(""):'<div class="empty">Rien ici pour l\'instant.</div>');
}
function totaux(l){var t={n:l.length,sub:0,tps:0,tvq:0,pb:0,tot:0};l.forEach(function(i){var r=i.r;t.sub+=cents(r.sous_total);t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.pb+=cents(r.pourboire);t.tot+=cents(r.total)});return t}
function vExporter(){
  var l=items.filter(function(i){return i.etat==="approuvee"}), t=totaux(l);
  return '<h1>Exporter</h1><p class="sub">Les factures approuvées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>Total</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><button class="btn gold" id="bXlsx"'+(t.n?"":" disabled")+'>Excel (.xlsx)</button><button class="btn" id="bCsv"'+(t.n?"":" disabled")+'>CSV</button></div>'+
  '<div class="row"><button class="btn" id="bVider">Vider la liste</button></div>'+
  '<p class="note">L\'Excel contient une feuille par mois et une feuille TPS/TVQ (CTI et RTI réclamables).</p>';
}

function ouvrir(id){
  var i=items.find(function(x){return x.id===id}); if(!i||i.etat==="lecture") return;
  var r=i.r||{}, f=function(k,l,t){return '<div><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" inputmode="'+(t||"decimal")+'" value="'+esc(r[k]==null?"":r[k])+'"></div>'};
  $("sheetIn").innerHTML='<div class="grab"></div>'+(i.thumb?'<img class="big" src="'+i.thumb+'" alt="">':"")+
  '<div class="tags" style="margin:0 0 6px">'+(i.alertes||[]).map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join("")+(i.modele?'<span class="tag">Lu par : '+esc(i.modele)+'</span>':"")+'</div>'+
  f("fournisseur","Fournisseur","text")+'<div class="g2">'+f("date","Date (AAAA-MM-JJ)","text")+f("numero","No de facture","text")+f("no_tps","No TPS","text")+f("no_tvq","No TVQ","text")+
  f("sous_total","Sous-total")+f("tps","TPS")+f("tvq","TVQ")+f("pourboire","Pourboire")+'</div>'+f("total","Total")+
  '<div class="row"><button class="btn" id="bRej">Rejeter</button><button class="btn" id="bSave">Enregistrer</button>'+(i.etat!=="approuvee"?'<button class="btn gold" id="bOk">Approuver</button>':"")+'</div>';
  $("sheet").classList.add("on");
  var lireForm=function(){["fournisseur","date","numero","no_tps","no_tvq"].forEach(function(k){r[k]=$("f_"+k).value.trim()});["sous_total","tps","tvq","pourboire","total"].forEach(function(k){r[k]=Number(String($("f_"+k).value).replace(",","."))||0});i.r=r;enrichir(i)};
  $("bSave").onclick=function(){lireForm();save();fermer();render();toast(i.alertes.length?i.alertes.length+" point(s) restant(s)":"Montants vérifiés")};
  if($("bOk")) $("bOk").onclick=function(){lireForm();i.etat="approuvee";save();fermer();render();toast("Approuvée")};
  $("bRej").onclick=function(){items=items.filter(function(x){return x.id!==id});save();fermer();render();toast("Facture retirée")};
}
function fermer(){$("sheet").classList.remove("on")}
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")fermer()});

function envoyer(){
  var l=items.filter(function(i){return i.etat==="approuvee"&&!i.envoye});
  if(!l.length) return toast("Tout est déjà envoyé");
  toast("Envoi à RBooks…");
  var h={"Content-Type":"application/json"}, code=localStorage.getItem(CODEKEY); if(code) h["x-capture-code"]=code;
  var ok=0, ko=0;
  l.reduce(function(p,i){return p.then(function(){var r=i.r||{};
    return fetch("/api/factures",{method:"POST",headers:h,body:JSON.stringify({cle:i.id,fournisseur:r.fournisseur,date:r.date,numero:r.numero,no_tps:r.no_tps,no_tvq:r.no_tvq,
      sous_total:r.sous_total,tps:r.tps,tvq:r.tvq,pourboire:r.pourboire,total:r.total,categorie:i.cat,cti_rti:i.cti==null?1:i.cti,alertes:i.alertes,thumb:i.thumb})})
    .then(function(x){if(x.status===401){localStorage.removeItem(CODEKEY);throw new Error("code")}if(!x.ok)throw new Error("envoi");return x.json()})
    .then(function(j){i.envoye="Dans RBooks · "+((j.facture&&j.facture.no)||"");i.envoiNo=j.facture&&j.facture.no;ok++;save();render()})
    .catch(function(e){ko++;if(e.message==="code")demanderCode()})})},Promise.resolve())
  .then(function(){toast(ko?(ok+" envoyée(s), "+ko+" en erreur : réessayez"):(ok+" facture"+(ok>1?"s":"")+" dans RBooks"))});
}

/* ---- exports ---- */
function lignes(){
  return items.filter(function(i){return i.etat==="approuvee"}).map(function(i){var r=i.r,cti=i.cti==null?1:i.cti,ok=r.no_tps&&r.no_tvq;
    return {"Date":r.date||"","Fournisseur":r.fournisseur||"","No facture":r.numero||"","Catégorie":i.cat||"","Sous-total":+(r.sous_total||0),"TPS":+(r.tps||0),"TVQ":+(r.tvq||0),"Pourboire":+(r.pourboire||0),"Total":+(r.total||0),
      "CTI réclamable":ok?Math.round((r.tps||0)*cti*100)/100:0,"RTI réclamable":ok?Math.round((r.tvq||0)*cti*100)/100:0,"No TPS":r.no_tps||"","No TVQ":r.no_tvq||"","Alertes":(i.alertes||[]).join(" | ")}});
}
function telecharger(nom,blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
function csv(){var L=lignes();if(!L.length)return;var h=Object.keys(L[0]),q=function(v){v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var t=[h.join(";")].concat(L.map(function(o){return h.map(function(k){return q(typeof o[k]==="number"?String(o[k]).replace(".",","):o[k])}).join(";")})).join("\r\n");
  telecharger("rbooks-factures.csv",new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}))}
function xlsx(){var L=lignes();if(!L.length||!window.XLSX)return toast("Excel indisponible hors ligne");var wb=XLSX.utils.book_new(),mois={};
  L.forEach(function(o){var m=(o.Date||"sans-date").slice(0,7);(mois[m]=mois[m]||[]).push(o)});
  Object.keys(mois).sort().forEach(function(m){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mois[m]),m.slice(0,31))});
  var t=totaux(items.filter(function(i){return i.etat==="approuvee"}));
  var tx=[["Résumé des taxes",""],["Factures",t.n],["TPS payée",t.tps/100],["TVQ payée",t.tvq/100],["CTI réclamables",L.reduce(function(s,o){return s+o["CTI réclamable"]},0)],["RTI réclamables",L.reduce(function(s,o){return s+o["RTI réclamable"]},0)],["Total",t.tot/100]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tx),"Taxes TPS-TVQ");XLSX.writeFile(wb,"rbooks-factures.xlsx")}

function bind(){
  var g=function(id,f){var e=$(id);if(e)e.onclick=f};
  g("bCam",function(){$("cam").click()}); g("bFiles",function(){$("files").click()});
  g("bDemo",function(){demo()}); g("goV",function(){view="verifier";render()}); g("bSendAll",envoyer); g("bCsv",csv); g("bXlsx",xlsx);
  g("bVider",function(){if(confirmer())return;items=[];save();render()});
  document.querySelectorAll(".item[data-id]").forEach(function(e){e.onclick=function(){ouvrir(e.dataset.id)}});
}
function confirmer(){var b=$("bVider");if(b.dataset.c)return false;b.dataset.c=1;b.textContent="Toucher encore pour tout effacer";return true}
var EX=[{f:"PETRO-CANADA",a:["Essence ordinaire","41,2 L x 1,478"],st:"60.88",tps:"3.04",tvq:"6.07",pb:"",t:"69.99",d:"2026-11-10",n:"483920"},
 {f:"RONA Saint-Hubert",a:["Vis a bois 2 1/2 po","Contreplaque 3/4","Ruban a mesurer"],st:"285.19",tps:"14.26",tvq:"28.44",pb:"",t:"327.89",d:"2026-11-08",n:"R-77120"},
 {f:"Bistro Le Rouge-Gorge",a:["Table 12 - 2 couverts"],st:"118.00",tps:"5.90",tvq:"11.77",pb:"11.45",t:"147.12",d:"2026-11-06",n:"T12-0447"}];
function recu(e){var cv=document.createElement("canvas");cv.width=520;cv.height=760;var x=cv.getContext("2d");
  x.fillStyle="#f7f4ec";x.fillRect(0,0,520,760);x.fillStyle="#222";x.textAlign="center";x.font="bold 34px monospace";x.fillText(e.f.toUpperCase().slice(0,22),260,80);
  x.font="20px monospace";x.fillText(e.d+"   No "+e.n,260,120);x.textAlign="left";var y=190;
  e.a.forEach(function(l){x.fillText(l,40,y);y+=40});y+=20;x.fillText("------------------------------",40,y);y+=44;
  var L=[["SOUS-TOTAL",e.st],["TPS 5%",e.tps],["TVQ 9,975%",e.tvq]];if(e.pb)L.push(["POURBOIRE",e.pb]);L.push(["TOTAL",e.t]);
  L.forEach(function(p){x.font=(p[0]==="TOTAL"?"bold 26px":"22px")+" monospace";x.fillText(p[0],40,y);x.textAlign="right";x.fillText(p[1]+" $",480,y);x.textAlign="left";y+=44});
  if(e.f.indexOf("Bistro")<0){x.font="16px monospace";x.fillText("TPS 123456789RT0001",40,700);x.fillText("TVQ 1234567890TQ0001",40,725)}
  return cv}
function demo(){
  EX.forEach(function(e,k){recu(e).toBlob(function(b){var f=new File([b],"exemple-"+k+".jpg",{type:"image/jpeg"});setTimeout(function(){lire(f,k)},k*300)},"image/jpeg",.85)});
  view="verifier"; setTimeout(render,50);
}
$("cam").onchange=function(){[].slice.call(this.files).forEach(function(f){lire(f)});this.value="";view="verifier";render()};
$("files").onchange=$("cam").onchange;
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();window.scrollTo(0,0)});

function demanderCode(){
  $("sheetIn").innerHTML='<h1>Code d\'accès</h1><p class="sub">Entrez le code fourni par l\'équipe RAWLF.</p><input id="fc" autocomplete="one-time-code"><div class="row"><button class="btn gold" id="bc">Continuer</button></div>';
  $("sheet").classList.add("on"); $("bc").onclick=function(){var v=$("fc").value.trim();if(v){localStorage.setItem(CODEKEY,v);fermer();toast("Code enregistré")}};
}

/* ---- thème clair / sombre (comme l'app RAWLF : data-theme, sinon le système) ---- */
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function sombre(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches}
function majTheme(){var d=sombre();$("bTheme").innerHTML=d?SUN:MOON;$("bTheme").setAttribute("aria-label",d?"Passer au thème clair":"Passer au thème sombre");
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute("content",d?"#0E0E0F":"#F6F4EF")})}
$("bTheme").onclick=function(){var t=sombre()?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("rbooks-theme",t)}catch(e){};majTheme()};
majTheme();
items.forEach(function(i){if(i.etat==="lecture")i.etat="erreur"});
fetch("/categories.json").then(function(r){return r.json()}).then(function(c){CATS=c}).catch(function(){});
fetch("/api/config").then(function(r){return r.json()}).then(function(c){CFG=c}).catch(function(){}).then(function(){
  var p=$("mode");p.textContent=CFG.mode==="ia"?"Lecture IA":"Démo";p.className="tag "+(CFG.mode==="ia"?"vert":"draft");
  if(CFG.code&&!localStorage.getItem(CODEKEY))demanderCode(); render();
});
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){})}
render();
})();
</script>
