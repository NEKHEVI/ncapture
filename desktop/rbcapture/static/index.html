<body>
<div class="splash" id="splash" aria-hidden="true"><div class="b"><img src="/assets/brand/ncapture-marque-fond-sombre.svg" alt=""><b><i>N</i>Capture</b><div class="bar"></div></div></div>
<header class="top">
  <a class="logo" href="/" aria-label="NCapture, accueil"><img class="lg-d" src="/assets/brand/ncapture-marque-fond-sombre.svg" alt=""><img class="lg-l" src="/assets/brand/ncapture-marque-fond-clair.svg" alt=""><b><i>N</i>Capture</b></a>
  <span class="sep"></span><span class="mod">NEKHEVI</span><span class="sp"></span>
  <span class="tag draft" id="mode">…</span>
  <a class="lnk" id="lNb" href="#" target="nbooks" aria-label="Ouvrir NBooks" hidden>NBooks<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg></a>
</header>
<main id="view"></main>
<nav id="nav" aria-label="Sections">
  <button data-v="capturer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>Capturer</button>
  <button data-v="verifier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l9 15.5H3z"/><path d="M12 10v4M12 16.8v.4"/></svg>À vérifier<span class="badge" id="bv" hidden></span></button>
  <button data-v="approuvees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Approuvées</button>
  <button data-v="exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>Exporter</button>
  <button data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>

<div class="sheet" id="sheet"><div class="in" id="sheetIn" role="dialog" aria-modal="true" aria-label="Facture"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="files" accept="image/*" multiple hidden>

<script src="/assets/ncapture-ui.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var ST={mode:"",nbooks_pret:false,nbooks_url:"",categories:[]}, DOCS=[], view="capturer", lecture=0, ouvertId=null, NEUF={}, AVANT=null;
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var vide=function(x){return x===""||x==null};
var money=function(x){return vide(x)?"":(Number(x)||0).toLocaleString("fr-CA",{style:"currency",currency:"CAD"})};
var cents=function(x){return Math.round((Number(String(x==null?"":x).replace(/\s/g,"").replace(",","."))||0)*100)};
function toast(t,ms){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},ms||3000)}
function api(u,o){return fetch(u,o).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function post(u,b){return api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})}
function nbPret(){return ST.nbooks_pret!=null?ST.nbooks_pret:ST.rbooks_pret}
function nbUrl(){return ST.nbooks_url||ST.rbooks_url||""}

function charger(){
  return Promise.all([api("/api/status"),api("/api/docs")]).then(function(v){
    ST=v[0];DOCS=v[1];
    var p=$("mode");p.textContent=ST.mode==="reel"?"Lecture IA":"Démo";p.className="tag "+(ST.mode==="reel"?"vert":"draft");
    var l=$("lNb");if(nbUrl()){l.href=nbUrl();l.hidden=false}else l.hidden=true;
    if(!$("sheet").classList.contains("on"))render();
  }).catch(function(){toast("Application locale injoignable")});
}
function grp(d){
  if(d.statut==="A_VERIFIER"||d.statut==="NON_LU")return "verifier";
  if(d.statut==="APPROUVE"||d.statut==="ENVOYE")return "approuvees";
  return "autres";
}
function numero(d){return d.bill_id?"CAP-"+d.id+((d.r&&d.r.no_facture)?"-"+d.r.no_facture:""):""}
function ton(a){return /incohérent|illisible|non réclamables|total|balance|impossible|non lu/i.test(a)?"rouge":"orange"}
function tagsAlertes(d){
  var r=d.r;if(!r)return "";
  var al=r.alertes||[];
  var t=r.equilibre?(al.length?'':'<span class="tag vert">Montants vérifiés</span>'):'<span class="tag rouge">Le total ne balance pas</span>';
  return t+al.map(function(a){return '<span class="tag '+ton(a)+'">'+esc(a)+'</span>'}).join("");
}

/* ---- vues ---- */
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===view);if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  var nv=DOCS.filter(function(d){return grp(d)==="verifier"}).length, bv=$("bv");bv.hidden=!nv;bv.textContent=nv;
  var v=$("view");
  if(view==="capturer")v.innerHTML=vCapturer();
  if(view==="verifier")v.innerHTML=vVerifier();
  if(view==="approuvees")v.innerHTML=vApprouvees();
  if(view==="exporter")v.innerHTML=vExporter();
  if(view==="reglages")v.innerHTML=NC.vueReglages({extra:vReglagesApp(),version:"App locale (ordinateur).",icone:"/assets/icon-192.png",licence:"/assets/LICENSE.txt"});
  bind();
  NEUF={};
}
function vCapturer(){
  var I=NC.icones, nv=DOCS.filter(function(d){return grp(d)==="verifier"}).length;
  var pret=DOCS.filter(function(d){return d.statut==="APPROUVE"}).length;
  return '<p class="eyebrow">Entreprise Démo inc.</p><h1>Capture de factures</h1><p class="sub">Photographiez vos factures et vos reçus : NCapture lit le fournisseur et les montants, vérifie la TPS et la TVQ, et prépare tout pour NBooks.</p>'+
  '<div class="home"><div>'+
  '<div class="shoot"><div class="frame corners" aria-hidden="true"></div>'+
  '<button class="shutter" id="bCam" aria-label="Prendre une photo de facture"><span>'+I.cam+'</span></button>'+
  '<div class="lbl">Prendre une photo</div><div class="hint">Une facture par photo, bien à plat et lisible.</div></div>'+
  '<div class="row" style="margin-top:0"><button class="btn" id="bFiles">'+I.img+'Galerie</button><button class="btn" id="bDemo">Exemples</button></div>'+
  (lecture?'<div class="busy"><div class="spin"></div>'+lecture+' lecture'+(lecture>1?'s':'')+' en cours…</div>':"")+'</div><div>'+
  (nv?'<div class="card go" id="goV" role="button" tabindex="0"><div><div class="n">'+nv+' facture'+(nv>1?'s':'')+' à vérifier</div><div class="tx">Corrigez au besoin, puis approuvez.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  (pret?'<div class="card go" id="goA" role="button" tabindex="0"><div><div class="n">'+pret+' prête'+(pret>1?'s':'')+' pour NBooks</div><div class="tx">Approuvées, pas encore envoyées.</div></div><span class="arr">'+I.arr+'</span></div>':"")+
  '<div class="tags" style="margin:0 0 12px">'+(nbPret()?'<span class="tag vert">NBooks : serveur prêt</span>':'<span class="tag orange">NBooks : serveur pas prêt, envoi en attente</span>')+'</div>'+
  '<div class="brief"><h3>Comment ça marche</h3><ol><li>Vous cadrez la facture et prenez la photo.</li><li>'+(ST.mode==="reel"?"L’IA lit le fournisseur et les montants ; le code refait tous les calculs.":"Démo : seules les photos déjà lues sont reconnues, les autres sont à saisir à la main ; le code refait tous les calculs.")+'</li><li>Vous corrigez au besoin, vous approuvez, puis NBooks crée la facture fournisseur.</li></ol></div>'+
  '</div></div>';
}
function carte(d){
  var r=d.r||{}, g=grp(d), tags="";
  if(g==="verifier")tags+=(d.r?tagsAlertes(d):'<span class="tag orange">À saisir</span>')+(d.message?'<span class="tag rouge">'+esc(d.message)+'</span>':"");
  if(g==="approuvees"){
    tags+=d.statut==="ENVOYE"?'<span class="tag vert">Dans NBooks</span><span class="tag draft">Facture '+esc(numero(d))+'</span>':'<span class="tag vert">Approuvée</span>';
    if(d.erreur_envoi)tags+='<span class="tag orange">'+esc(d.erreur_envoi)+'</span>';
  }
  if(g==="autres")tags+='<span class="tag rouge">'+esc(d.message||(d.statut==="REJETE"?"Rejetée":d.statut))+(d.doublon_de?" ("+esc(d.doublon_de)+")":"")+'</span>';
  if(r.categorie_code)tags+='<span class="tag">'+esc(r.categorie_code+" "+r.categorie)+'</span>';
  if(d.photos.length>1)tags+='<span class="tag">'+d.photos.length+' photos</span>';
  return '<div class="card item'+(NEUF[d.id]?' lit':'')+'" data-id="'+esc(d.id)+'" role="button" tabindex="0"><div class="ph">'+(d.photos[0]?'<img src="'+esc(d.photos[0])+'" alt="" loading="lazy">':'')+'</div>'+
  '<div><div class="n">'+esc(r.marchand||(g==="verifier"?"Fournisseur à saisir":(d.fichiers[0]||"Facture")))+'</div>'+
  '<div class="m">'+esc(r.date||"")+(r.no_facture?" · "+esc(r.no_facture):"")+'</div>'+
  (d.r?'<div class="tx">TPS '+(money(r.tps)||"0,00 $")+' · TVQ '+(money(r.tvq)||"0,00 $")+'</div>':"")+'</div>'+
  '<div class="tot">'+(d.r?money(r.total):"")+'</div><div class="tags">'+tags+'</div></div>';
}
function liste(g){return DOCS.filter(function(d){return grp(d)===g})}
function vVerifier(){
  var l=liste("verifier"), a=liste("autres");
  return '<p class="eyebrow">File d’approbation</p><h1>À vérifier</h1><p class="sub">Touchez une facture pour corriger les montants, puis approuvez-la.</p>'+
   (lecture?'<div class="busy"><div class="spin"></div>'+lecture+' lecture'+(lecture>1?'s':'')+' en cours…</div>':"")+
   (l.length?'<div class="list">'+l.map(carte).join("")+'</div>':(lecture?'':'<div class="empty">Rien ici pour l\'instant.</div>'))+
   (a.length?'<div class="sec">Doublons et rejetées</div><div class="list">'+a.map(carte).join("")+'</div>':"");
}
function vApprouvees(){
  var l=liste("approuvees"), ne=l.filter(function(d){return d.statut==="APPROUVE"}).length;
  var head='<p class="eyebrow">Prêtes pour la comptabilité</p><h1>Approuvées</h1><p class="sub">Les factures approuvées sont créées comme factures fournisseurs dans NBooks.</p>';
  if(l.length)head+=ne?'<button class="btn gold full" id="bSendAll" style="margin-bottom:14px">Envoyer '+ne+' facture'+(ne>1?'s':'')+' à NBooks</button>':'<div class="brief" style="text-align:center;font-weight:600">Tout est envoyé à NBooks.</div>';
  return head+(l.length?'<div class="list">'+l.map(carte).join("")+'</div>':'<div class="empty">Rien ici pour l\'instant.</div>');
}
function vExporter(){
  var l=DOCS.filter(function(d){return d.statut==="A_VERIFIER"||d.statut==="APPROUVE"||d.statut==="ENVOYE"}), t={n:l.length,tps:0,tvq:0,tot:0,cti:0};
  l.forEach(function(d){var r=d.r||{};t.tps+=cents(r.tps);t.tvq+=cents(r.tvq);t.tot+=cents(r.total);t.cti+=cents(r.cti)+cents(r.rti)});
  var off=t.n?"":' aria-disabled="true" tabindex="-1" style="pointer-events:none;opacity:.5"';
  return '<p class="eyebrow">Comptabilité</p><h1>Exporter</h1><p class="sub">Les factures à vérifier, approuvées et envoyées, prêtes pour la comptabilité.</p>'+
  '<div class="kpis"><div class="kpi hero"><small>Total</small><b>'+money(t.tot/100)+'</b></div><div class="kpi"><small>Factures</small><b>'+t.n+'</b></div><div class="kpi"><small>CTI + RTI</small><b>'+money(t.cti/100)+'</b></div><div class="kpi"><small>TPS</small><b>'+money(t.tps/100)+'</b></div><div class="kpi"><small>TVQ</small><b>'+money(t.tvq/100)+'</b></div></div>'+
  '<div class="row"><a class="btn gold" id="bXlsx" href="/export/transactions.xlsx" download'+off+'>Excel (.xlsx)</a><a class="btn" id="bCsv" href="/export/transactions.csv" download'+off+'>CSV</a><a class="btn" id="bCsvFr" href="/export/transactions.csv?excel_fr=true" download'+off+'>CSV Excel (fr)</a></div>'+
  '<div class="row"><button class="btn ghost" id="bVider">Remettre la démo à zéro</button></div>'+
  '<p class="note">L’export contient la TPS, la TVQ et les CTI/RTI réclamables (repas à 50 %), une ligne par facture.</p>';
}
function vReglagesApp(){
  return '<div class="sec">Lecture et NBooks</div><div class="card"><div class="kv"><span>Lecture</span><b>'+(ST.mode==="reel"?"IA (Claude)":"Démo, cache seulement")+'</b></div>'+
  '<div class="kv"><span>NBooks</span><b>'+(nbPret()?"Serveur prêt":"Pas prêt, envoi en attente")+'</b></div>'+
  (nbUrl()?'<div class="kv"><span>Adresse NBooks</span><b>'+esc(nbUrl())+'</b></div>':'')+
  '<div class="kv"><span>Ce poste</span><b>'+esc(location.host)+'</b></div></div>';
}

/* ---- fiche : lecture et correction au pouce ---- */
var MONT=["sous_total","tps","tvq","pourboire","total"];
var NOMS={sous_total:"Sous-total",tps:"TPS 5 %",tvq:"TVQ 9,975 %",pourboire:"Pourboire",total:"Total"};
var vNum=function(x){return vide(x)?"":String((Number(String(x).replace(",","."))||0).toFixed(2)).replace(".",",")};
function ouvrir(id){
  var d=DOCS.find(function(x){return x.id===id});if(!d)return;
  ouvertId=id;
  var r=d.r||{}, c=d.corrections||{}, envoye=d.statut==="ENVOYE", ferme=envoye||grp(d)==="autres", dis=ferme?" disabled":"";
  var ini=function(k){var x=c[k]!=null?c[k]:(k==="categorie"?r.categorie_code:r[k]);return x==null?"":String(x)};
  var t=function(k,l){return '<div><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" data-k="'+k+'" autocomplete="off" value="'+esc(ini(k))+'"'+dis+'></div>'};
  var f=function(k){return '<div class="fig'+(k==="total"?' total':'')+'" id="g_'+k+'"><label for="f_'+k+'">'+NOMS[k]+'</label><input id="f_'+k+'" data-k="'+k+'" data-m="1" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="'+esc(vNum(ini(k)))+'" placeholder="0,00"'+dis+'></div>'};
  var cur=ini("categorie");
  var opts=(ST.categories||[]).map(function(x){return '<option value="'+esc(x.code)+'"'+(x.code===cur?" selected":"")+'>'+esc(x.code+" "+x.nom)+'</option>'}).join("");
  var peutCompleter=d.statut==="A_VERIFIER"||d.statut==="NON_LU";
  var h='<div class="grab"></div><div class="side"><div class="ph-big" id="phBig">'+(d.photos[0]?'<img src="'+esc(d.photos[0])+'" alt="Photo de la facture">':'')+'</div>'+
   '<div class="tags" id="fTags" style="margin:0 0 4px"></div>'+
   (d.photos.length>1?'<div class="tags" style="margin:4px 0">'+d.photos.slice(1).map(function(p,k){return '<a href="'+esc(p)+'" target="_blank" rel="noopener"><img src="'+esc(p)+'" alt="Photo '+(k+2)+'" style="height:56px;width:auto;border-radius:8px;border:1px solid var(--nk-border)"></a>'}).join("")+'</div>':'')+
   (d.message?'<div class="tags" style="margin:0 0 6px"><span class="tag rouge">'+esc(d.message)+'</span></div>':'')+
   (d.erreur_envoi?'<div class="tags" style="margin:0 0 6px"><span class="tag orange">'+esc(d.erreur_envoi)+'</span></div>':'')+
   (peutCompleter?'<div style="margin:6px 0 4px"><button type="button" class="btn" id="bRe" style="width:100%">Reprendre une photo pour compléter</button><p class="note" style="margin:6px 0 0">Il manque une date, un montant ou un numéro ? Photographiez la partie manquante : seuls les champs vides sont remplis, rien de ce que vous avez saisi n’est remplacé.</p></div>':'')+
   '</div><div class="form"><p class="eyebrow" style="margin:6px 0 0">'+(envoye?"Dans NBooks":d.statut==="APPROUVE"?"Approuvée":ferme?"Hors de la file":"Vérifiez la lecture")+'</p>';
  if(envoye)h+='<div class="brief" style="margin:8px 0"><div class="kv"><span>Facture fournisseur</span><b>'+esc(numero(d))+'</b></div><div class="kv"><span>Identifiant NBooks</span><b>#'+esc(d.bill_id)+'</b></div></div>';
  h+='<div class="who"><label for="f_marchand" class="sr">Fournisseur</label><input id="f_marchand" data-k="marchand" autocomplete="off" placeholder="Fournisseur" value="'+esc(ini("marchand"))+'"'+dis+'></div>'+
   '<div class="g2">'+t("date","Date (AAAA-MM-JJ)")+t("no_facture","No de facture")+'</div>'+
   '<div class="figs">'+MONT.map(f).join("")+'</div><p class="note" id="fCalc" style="margin:-4px 0 6px"></p>'+
   '<label for="f_categorie">Catégorie</label><select id="f_categorie" data-k="categorie"'+dis+'>'+opts+'</select>'+
   '<details class="plus"'+((ini("no_tps")&&ini("no_tvq"))?'':' open')+'><summary>Numéros de taxe (CTI / RTI)</summary><div class="g2">'+t("no_tps","No TPS")+t("no_tvq","No TVQ")+'</div></details>'+
   (!vide(r.cti)?'<div class="kv" style="margin-top:8px"><span>CTI / RTI réclamables</span><b>'+money(r.cti)+' · '+money(r.rti)+'</b></div>':'')+'</div>';
  var b='';
  if(d.statut==="A_VERIFIER"||d.statut==="NON_LU")b+='<button class="btn ghost danger" id="bRej" aria-label="Rejeter la facture">Rejeter</button>';
  if(!ferme)b+='<button class="btn" id="bSave">Enregistrer</button>';
  if(d.statut==="A_VERIFIER")b+='<button class="btn gold" id="bOk">Approuver</button>';
  if(d.statut==="APPROUVE")b+='<button class="btn gold" id="bSend">Envoyer à NBooks</button>';
  if(ferme)b+='<button class="btn" id="bClose">Fermer</button>';
  h+='<div class="acts">'+b+'</div>';
  $("sheetIn").innerHTML=h;$("sheet").classList.add("on");
  var g=function(i,fn){var e=$(i);if(e)e.onclick=fn};
  var champs=function(){var o={},ch=false;document.querySelectorAll("#sheetIn [data-k]").forEach(function(e){var v=e.value.trim(),k=e.dataset.k;
      if(e.dataset.m){if(cents(v)===cents(ini(k))&&vide(v)===vide(ini(k)))return}
      else if(v===ini(k))return;
      o[k]=v;ch=true});return ch?o:null};
  var maj=function(){
    $("fTags").innerHTML=tagsAlertes(d)+(d.moteur?'<span class="tag">Lu par : '+esc(d.moteur)+'</span>':"");
    var val=function(k){return cents($("f_"+k).value)};
    var s=val("sous_total")+val("tps")+val("tvq")+val("pourboire"), ok=Math.abs(s-val("total"))<=3;
    $("g_total").classList.toggle("bad",!ok&&s>0);
    $("fCalc").innerHTML=!ok&&s>0&&!ferme?'Somme des montants : <b>'+money(s/100)+'</b> <button type="button" class="lnk" id="bSum" style="height:32px;margin-left:6px">Utiliser</button>':"";
    var bs=$("bSum"); if(bs) bs.onclick=function(){$("f_total").value=vNum(s/100);maj()};
  };
  maj();
  $("sheetIn").querySelectorAll("input,select").forEach(function(e){e.addEventListener("input",maj);e.addEventListener("change",maj)});
  MONT.forEach(function(k){$("f_"+k).addEventListener("focus",function(){this.select()})});
  var occupe=function(on){document.querySelectorAll("#sheetIn .btn").forEach(function(e){e.disabled=on})};
  var enregistrer=function(){var o=champs();return o?post("/api/docs/"+d.id+"/correct",o):Promise.resolve()};
  AVANT=ferme?null:enregistrer;
  var fin=function(msg,ms){fermer();return charger().then(function(){toast(msg(DOCS.find(function(y){return y.id===d.id})),ms||3000)})};
  var err=function(e){occupe(false);toast("Erreur : "+e.message)};
  g("bSave",function(){occupe(true);enregistrer().then(function(){return fin(function(n){var a=n&&n.r?n.r.alertes.length:0;return a?"Enregistrée : "+a+" point(s) restant(s)":"Correction enregistrée"})}).catch(err)});
  g("bOk",function(){occupe(true);toast("Envoi à NBooks…",60000);
    enregistrer().then(function(){return post("/api/docs/"+d.id+"/approve")}).then(function(x){
      if(!x.envoi)view="approuvees";
      return fin(function(n){return x.envoi?"Approuvée. "+x.envoi:"Dans NBooks : facture "+(n?numero(n):"")},6000)}).catch(err)});
  g("bSend",function(){occupe(true);toast("Envoi à NBooks…",60000);
    enregistrer().then(function(){return post("/api/docs/"+d.id+"/send")}).then(function(x){
      return fin(function(n){return x.ok?"Dans NBooks : facture "+(n?numero(n):""):x.erreur},6000)}).catch(err)});
  g("bRej",function(){var bt=$("bRej");if(!bt.dataset.c){bt.dataset.c=1;bt.textContent="Confirmer";return}
    post("/api/docs/"+d.id+"/reject").then(function(){return fin(function(){return "Facture rejetée"})}).catch(err)});
  g("bClose",fermer);
  g("bRe",function(){var fi=$("files");fi.dataset.completer=d.id;fi.removeAttribute("multiple");
    NC.viseur({photo:function(fl){NC.fermerViseur();delete fi.dataset.completer;fi.setAttribute("multiple","");completer(d.id,fl,enregistrer)},
      secours:function(){fi.setAttribute("capture","environment");fi.click()},galerie:function(){fi.click()},
      fin:function(){delete fi.dataset.completer;fi.setAttribute("multiple","")}})});
}
function fermer(){$("sheet").classList.remove("on");ouvertId=null;AVANT=null;render()}
$("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")fermer()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){NC.fermerViseur();if(ouvertId)fermer()}});

/* 2e photo de la même facture : le serveur remplit seulement les champs encore vides */
function completer(id,file,avant){
  var ph=$("phBig"); if(ph) ph.classList.add("scan");
  var b=$("bRe"); if(b){b.disabled=true;b.textContent="Lecture de la 2e photo…"}
  lecture++;
  (avant?avant():Promise.resolve()).then(function(){
    var fd=new FormData(); fd.append("file",file);
    return api("/api/docs/"+id+"/complete",{method:"POST",body:fd});
  }).then(function(x){toast(x.message||(x.ok?"Complétée":"Rien de nouveau"),5000)})
  .catch(function(e){toast("Lecture impossible : "+e.message,5000)})
  .then(function(){lecture--;return charger()}).then(function(){if(ouvertId===id)ouvrir(id)});
}

/* ---- actions ---- */
function televerser(files){
  files=[].slice.call(files);if(!files.length)return;
  var fd=new FormData();files.forEach(function(f){fd.append("files",f)});
  lecture+=files.length;view="verifier";render();toast("Lecture en cours…",60000);
  api("/api/upload",{method:"POST",body:fd}).then(function(r){
    r.forEach(function(x){if(x.id)NEUF[x.id]=1});
    var n=r.filter(function(x){return x.action==="a_verifier"||x.action==="fusionne"}).length;
    toast(r.length+" photo"+(r.length>1?"s":"")+" reçue"+(r.length>1?"s":"")+" : "+n+" à vérifier",5000);
  }).catch(function(e){toast("Lecture impossible : "+e.message,5000)}).then(function(){lecture-=files.length;return charger()});
}
function demo(){toast("Chargement des exemples…",30000);view="verifier";lecture++;render();
  post("/api/demo-load").then(function(r){(r||[]).forEach(function(x){if(x.id)NEUF[x.id]=1});toast("Exemples chargés")}).catch(function(e){toast("Erreur : "+e.message)}).then(function(){lecture--;return charger()})}
function envoyerTout(){toast("Envoi à NBooks…",60000);post("/api/send-approved").then(function(r){toast(r.envoyes+" / "+r.total+" facture(s) dans NBooks",5000);return charger()}).catch(function(e){toast("Erreur : "+e.message)})}
function prendre(){NC.viseur({photo:function(f){televerser([f])},secours:function(){$("cam").click()},galerie:function(){$("files").click()},
  fin:function(n){if(n){view="verifier";render()}}})}
function bind(){
  var g=function(id,f){var e=$(id);if(e)e.onclick=f};
  g("bCam",prendre);g("bFiles",function(){$("files").click()});g("bDemo",demo);
  g("goV",function(){view="verifier";render()});g("goA",function(){view="approuvees";render()});g("bSendAll",envoyerTout);
  g("bVider",function(){var b=$("bVider");if(!b.dataset.c){b.dataset.c=1;b.textContent="Toucher encore pour tout effacer";return}post("/api/reset").then(function(){return charger()}).then(function(){toast("Démo remise à zéro")})});
  document.querySelectorAll(".item[data-id]").forEach(function(e){e.onclick=function(){ouvrir(e.dataset.id)}});
  document.querySelectorAll(".go,.item[data-id]").forEach(function(e){e.onkeydown=function(k){if(k.key==="Enter"||k.key===" "){k.preventDefault();e.click()}}});
  if(view==="reglages")NC.lierReglages();
}
$("cam").onchange=function(){televerser(this.files);this.value=""};
$("files").onchange=function(){
  var id=this.dataset.completer; delete this.dataset.completer; this.setAttribute("multiple",""); this.removeAttribute("capture");
  if(id){var fl=this.files&&this.files[0];this.value="";if(fl)completer(id,fl,ouvertId===id?AVANT:null);return}
  televerser(this.files);this.value=""};
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;render();window.scrollTo(0,0)});

var q=new URLSearchParams(location.search); if(q.get("vue")) view=q.get("vue");
render();charger().then(function(){if(q.get("fiche"))ouvrir(q.get("fiche"))});
NC.demarrer();
setInterval(function(){if(!ouvertId&&!lecture)charger()},8000);
})();
</script>
</body>
